<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GRILLZ STUDIO — AUTO-FIT</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- MediaPipe AI -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <!-- Three.js & Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #0b0c10; overflow: hidden; font-family: 'Syne', sans-serif;
    }
    .input_video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
    }
    .output_canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2; transform: scaleX(-1); pointer-events: none;
    }
    #mobileConsole {
      position: absolute; top: 10px; left: 10px; right: 10px;
      max-height: 120px; overflow-y: auto; background: rgba(0, 0, 0, 0.85);
      color: #00ffcc; padding: 8px; border-radius: 6px; font-family: monospace;
      font-size: 10px; z-index: 30; border: 1px solid #00ffcc; pointer-events: none;
    }
    .ui-layer {
      position: absolute; bottom: 30px; left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; z-index: 10;
      pointer-events: none;
    }
    .logo {
      font-size: 20px; font-weight: 800; color: #d4af37;
      text-transform: uppercase; letter-spacing: 2px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8);
    }
    #loadingScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0c10; z-index: 40; display: flex; flex-direction: column;
      justify-content: center; align-items: center; transition: opacity 0.5s ease;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #d4af37; font-size: 13px; letter-spacing: 2px; }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">ŁADOWANIE MODELI 10MB...</div>
  </div>

  <div id="mobileConsole">Start...</div>

  <video class="input_video" autoplay playsinline muted></video>
  <canvas class="output_canvas"></canvas>

  <div class="ui-layer">
    <div class="logo">Grillz Studio</div>
  </div>

  <script>
    const consoleDiv = document.getElementById('mobileConsole');
    function logOnScreen(msg, isError = false) {
      console.log(msg);
      const time = new Date().toLocaleTimeString();
      consoleDiv.innerHTML += `<br><span style="color: ${isError ? '#ff4444' : '#00ffcc'}">[${time}] ${msg}</span>`;
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    const URL_TOP = "https://raw.githubusercontent.com/jakubgroth-tech/grillz-studio/main/grillz-top.glb";
    const URL_BOTTOM = "https://raw.githubusercontent.com/jakubgroth-tech/grillz-studio/main/grillz-bottom.glb"; 

    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.querySelector('.output_canvas');
    const loadingScreen = document.getElementById('loadingScreen');

    setTimeout(() => {
      if (loadingScreen.style.display !== 'none') {
        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 500);
      }
    }, 4000);

    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.5;

    const scene = new THREE.Scene();

    let width = window.innerWidth;
    let height = window.innerHeight;
    const camera = new THREE.OrthographicCamera(-width/2, width/2, height/2, -height/2, 0.1, 1000);
    camera.position.z = 100;

    // Światła studyjne
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const frontLight = new THREE.DirectionalLight(0xffffee, 3.0);
    frontLight.position.set(0, 0, 50);
    scene.add(frontLight);
    const topLight = new THREE.DirectionalLight(0xffffff, 2.0);
    topLight.position.set(0, 50, 20);
    scene.add(topLight);

    let topGrillzModel = null;
    let bottomGrillzModel = null;
    let loadedCount = 0;

    function checkLoaded() {
      loadedCount++;
      if (loadedCount >= 2) {
        logOnScreen("Wszystkie modele przetworzone!");
        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 500);
      }
    }

    const gltfLoader = new THREE.GLTFLoader();
    
    // Funkcja optymalizująca i naprawiająca materiał/skalę wczytanego modelu 10MB
    function setupModel(gltf, name) {
      const model = gltf.scene;
      
      // Automatyczne obliczenie skali i rozmiaru w oparciu o Bounding Box modelu
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      box.getSize(size);
      logOnScreen(`${name} rozmiar: X:${size.x.toFixed(1)} Y:${size.y.toFixed(1)}`);

      model.traverse((child) => {
        if (child.isMesh) {
          child.visible = true;
          // Zapewniamy, że materiał wygląda jak złoto, jeśli plik zapisał surowe kolory
          if (child.material) {
            child.material.metalness = 0.9;
            child.material.roughness = 0.15;
            child.material.color.setHex(0xffd700);
          }
        }
      });

      return model;
    }

    logOnScreen("Pobieranie góry 10MB...");
    gltfLoader.load(URL_TOP, (gltf) => {
      topGrillzModel = setupModel(gltf, "Góra");
      scene.add(topGrillzModel);
      topGrillzModel.visible = false;
      logOnScreen("Góra gotowa!");
      checkLoaded();
    }, undefined, (err) => {
      logOnScreen("BŁĄD GÓRY: " + err.message, true);
      checkLoaded();
    });

    logOnScreen("Pobieranie dołu 10MB...");
    gltfLoader.load(URL_BOTTOM, (gltf) => {
      bottomGrillzModel = setupModel(gltf, "Dół");
      scene.add(bottomGrillzModel);
      bottomGrillzModel.visible = false;
      logOnScreen("Dół gotowy!");
      checkLoaded();
    }, undefined, (err) => {
      logOnScreen("BŁĄD DOŁU: " + err.message, true);
      checkLoaded();
    });

    function onResults(results) {
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      if (width !== window.innerWidth) {
        width = window.innerWidth; height = window.innerHeight;
        camera.left = -width/2; camera.right = width/2;
        camera.top = height/2; camera.bottom = -height/2;
        camera.updateProjectionMatrix();
      }

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        const leftCorner = landmarks[61];
        const rightCorner = landmarks[291];
        const mouthCenterTop = landmarks[13]; 
        const mouthCenterBottom = landmarks[14];

        // Bazowa szerokość ust w pikselach
        const mouthWidthPixels = Math.sqrt(Math.pow((rightCorner.x - leftCorner.x) * width, 2) + Math.pow((rightCorner.y - leftCorner.y) * height, 2));
        
        // Dynamiczna skala dostosowana do 10-megabajtowych modeli z Blendera
        // Jeśli model w Blenderze był modelowany w metrach, ta skala go dopasuje do pikseli ekranu
        const autoScale = mouthWidthPixels * 0.8; 

        const angleZ = Math.atan2((rightCorner.y - leftCorner.y) * height, (rightCorner.x - leftCorner.x) * width);
        const angleY = Math.asin((rightCorner.z - leftCorner.z) * 2);
        const topFace = landmarks[10]; const bottomFace = landmarks[152];
        const angleX = -Math.atan2((bottomFace.z - topFace.z), (bottomFace.y - topFace.y));

        if (topGrillzModel) {
          topGrillzModel.visible = true;
          topGrillzModel.scale.set(autoScale, autoScale, autoScale);
          topGrillzModel.rotation.set(angleX, angleY, -angleZ);
          topGrillzModel.position.x = (mouthCenterTop.x - 0.5) * width;
          topGrillzModel.position.y = -(mouthCenterTop.y - 0.5) * height;
          topGrillzModel.position.z = (mouthCenterTop.z * width);
        }

        if (bottomGrillzModel) {
          bottomGrillzModel.visible = true;
          bottomGrillzModel.scale.set(autoScale, autoScale, autoScale);
          bottomGrillzModel.rotation.set(angleX, angleY, -angleZ);
          bottomGrillzModel.position.x = (mouthCenterBottom.x - 0.5) * width;
          bottomGrillzModel.position.y = -(mouthCenterBottom.y - 0.5) * height;
          bottomGrillzModel.position.z = (mouthCenterBottom.z * width);
        }

      } else {
        if(topGrillzModel) topGrillzModel.visible = false;
        if(bottomGrillzModel) bottomGrillzModel.visible = false;
      }

      renderer.render(scene, camera);
    }

    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});
    
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    faceMesh.onResults(onResults);

    const cameraHelper = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 1280,
      height: 720
    });
    cameraHelper.start();
  </script>
</body>
</html>
