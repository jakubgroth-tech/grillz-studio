<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRILLZ STUDIO — Virtual Try-On</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(22, 24, 31, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-gold: #d4af37;
      --accent-gold-hover: #f3ce5a;
      --text-main: #f0f2f5;
      --text-muted: #8a8f9e;
      --input-bg: #12141c;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color); color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .container {
      width: 100%; max-width: 440px; background: var(--card-bg);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 28px 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .header { text-align: center; margin-bottom: 24px; }
    .logo { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--accent-gold); }
    
    .preview-box {
      width: 100%; background: var(--input-bg);
      border: 2px dashed var(--card-border); border-radius: var(--radius);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center; margin-bottom: 12px; cursor: pointer;
      min-height: 300px;
    }
    .preview-box input[type="file"] {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10;
    }
    .upload-text { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px; }
    .upload-text span { display: block; color: var(--accent-gold); font-weight: 600; font-size: 15px; }

    canvas { max-width: 100%; height: auto; display: none; display: block; }
    #imageCanvas { z-index: 1; }
    #maskCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; cursor: crosshair; display: none; }

    .instructions {
      font-size: 12px; color: var(--accent-gold); text-align: center;
      margin-bottom: 16px; display: none; background: rgba(212, 175, 55, 0.1);
      padding: 8px; border-radius: 8px;
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 12px 14px; color: var(--text-main); font-size: 14px; outline: none;
    }
    
    .btn-submit {
      width: 100%; background: var(--accent-gold); color: #000; border: none;
      border-radius: 10px; padding: 15px; font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 10px;
    }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    #clearBtn {
      background: transparent; color: var(--text-muted); border: 1px solid var(--card-border);
      padding: 6px 12px; font-size: 11px; border-radius: 6px; cursor: pointer; margin: 0 auto 16px auto; display: none;
    }

    #statusText { text-align: center; font-size: 12px; color: var(--accent-gold); margin-top: 12px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">Grillz Studio</div>
    </div>

    <div class="preview-box" id="dropArea">
      <input type="file" id="imageInput" accept="image/*">
      <div class="upload-text" id="uploadPlaceholder">
        <span>Wgraj zdjęcie uśmiechu</span>(Format zostanie zachowany 1:1)
      </div>
      <canvas id="imageCanvas"></canvas>
      <canvas id="maskCanvas"></canvas>
    </div>

    <div class="instructions" id="hint">🖌️ Zamaluj pędzlem wyłącznie zęby</div>
    <button type="button" id="clearBtn">Wyczyść pędzel</button>

    <div class="form-group">
      <label>Materiał</label>
      <select id="material">
        <option value="14k shiny gold">Złoto 14K</option>
        <option value="925 sterling silver">Srebro 925</option>
      </select>
    </div>

    <div class="form-group">
      <label>Pozycja</label>
      <select id="position">
        <option value="top teeth">Góra (Górny łuk)</option>
        <option value="bottom teeth">Dół (Dolny łuk)</option>
        <option value="full set of teeth">Full (Góra i Dół)</option>
      </select>
    </div>

    <button type="button" class="btn-submit" id="generateBtn">Nałóż Grillz</button>

    <div id="statusText">AI precyzyjnie dopasowuje biżuterię...</div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const imageCanvas = document.getElementById('imageCanvas');
    const maskCanvas = document.getElementById('maskCanvas');
    const imgCtx = imageCanvas.getContext('2d');
    const maskCtx = maskCanvas.getContext('2d');
    
    const hiddenMaskCanvas = document.createElement('canvas');
    const hiddenMaskCtx = hiddenMaskCanvas.getContext('2d');

    let loadedImage = null;
    let isDrawing = false;

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImage = new Image();
        loadedImage.onload = setupCanvases;
        loadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function setupCanvases() {
      // Ustawiamy canvas dokładnie w proporcjach wgranego zdjęcia (zero deformacji)
      const width = loadedImage.width;
      const height = loadedImage.height;

      imageCanvas.width = maskCanvas.width = hiddenMaskCanvas.width = width;
      imageCanvas.height = maskCanvas.height = hiddenMaskCanvas.height = height;

      imgCtx.drawImage(loadedImage, 0, 0);
      clearMasks();

      document.getElementById('uploadPlaceholder').style.display = 'none';
      imageInput.style.display = 'none';
      imageCanvas.style.display = 'block';
      maskCanvas.style.display = 'block';
      document.getElementById('hint').style.display = 'block';
      document.getElementById('clearBtn').style.display = 'block';
    }

    function clearMasks() {
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      hiddenMaskCtx.fillStyle = '#000000';
      hiddenMaskCtx.fillRect(0, 0, hiddenMaskCanvas.width, hiddenMaskCanvas.height);
    }
    document.getElementById('clearBtn').addEventListener('click', clearMasks);

    function getPos(e) {
      const rect = maskCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      // Przelicznik pozycji myszy/palca względem oryginalnej rozdzielczości zdjęcia
      const scaleX = maskCanvas.width / rect.width;
      const scaleY = maskCanvas.height / rect.height;
      return { 
        x: (clientX - rect.left) * scaleX, 
        y: (clientY - rect.top) * scaleY 
      };
    }

    function startDraw(e) { e.preventDefault(); if(loadedImage) { isDrawing = true; draw(e); } }
    function stopDraw() { isDrawing = false; maskCtx.beginPath(); hiddenMaskCtx.beginPath(); }
    
    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      const brushSize = Math.max(imageCanvas.width * 0.03, 15); // Dynamiczny rozmiar pędzla

      maskCtx.lineWidth = brushSize;
      maskCtx.lineCap = 'round';
      maskCtx.strokeStyle = 'rgba(212, 175, 55, 0.65)';
      maskCtx.lineTo(pos.x, pos.y);
      maskCtx.stroke();
      maskCtx.beginPath();
      maskCtx.moveTo(pos.x, pos.y);

      hiddenMaskCtx.lineWidth = brushSize;
      hiddenMaskCtx.lineCap = 'round';
      hiddenMaskCtx.strokeStyle = '#FFFFFF';
      hiddenMaskCtx.lineTo(pos.x, pos.y);
      hiddenMaskCtx.stroke();
      hiddenMaskCtx.beginPath();
      hiddenMaskCtx.moveTo(pos.x, pos.y);
    }

    maskCanvas.addEventListener('mousedown', startDraw);
    maskCanvas.addEventListener('mousemove', draw);
    maskCanvas.addEventListener('mouseup', stopDraw);
    maskCanvas.addEventListener('mouseleave', stopDraw);
    maskCanvas.addEventListener('touchstart', startDraw, {passive: false});
    maskCanvas.addEventListener('touchmove', draw, {passive: false});
    maskCanvas.addEventListener('touchend', stopDraw);

    document.getElementById('generateBtn').addEventListener('click', async () => {
      if (!loadedImage) { alert('Wgraj zdjęcie!'); return; }

      const generateBtn = document.getElementById('generateBtn');
      const statusText = document.getElementById('statusText');

      generateBtn.disabled = true;
      statusText.style.display = 'block';

      try {
        const imageB64 = imageCanvas.toDataURL('image/jpeg', 0.95);
        const maskB64 = hiddenMaskCanvas.toDataURL('image/png');
        const material = document.getElementById('material').value;
        const position = document.getElementById('position').value;

        const response = await fetch('/.netlify/functions/generate-grillz', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: imageB64,
            mask: maskB64,
            material: material,
            position: position
          })
        });

        const responseText = await response.text();
        let data;
        try {
          data = JSON.parse(responseText);
        } catch (e) {
          throw new Error(`Błąd serwera: ${responseText}`);
        }

        if (!response.ok) throw new Error(data.error || 'Błąd generowania');

        // PODMIANA W MIEJSCU: Wynik ładuje się bezpośrednio do głównego podglądu
        loadedImage = new Image();
        loadedImage.onload = () => {
          setupCanvases();
          // Po załadowaniu nowego zdjęcia ukrywamy pędzel, pokazując gotowy efekt
          maskCanvas.style.display = 'none';
          document.getElementById('hint').style.display = 'none';
          document.getElementById('clearBtn').style.display = 'none';
        };
        loadedImage.src = data.image;

      } catch (err) {
        alert('SZCZEGÓŁY BŁĘDU:\n\n' + err.message);
      } finally {
        generateBtn.disabled = false;
        statusText.style.display = 'none';
      }
    });
  </script>
</body>
</html>
