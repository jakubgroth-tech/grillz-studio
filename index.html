<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRILLZ STUDIO — Virtual Try-On</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(22, 24, 31, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-gold: #d4af37;
      --accent-gold-hover: #f3ce5a;
      --text-main: #f0f2f5;
      --text-muted: #8a8f9e;
      --input-bg: #12141c;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color); color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .container {
      width: 100%; max-width: 440px; background: var(--card-bg);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 28px 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .header { text-align: center; margin-bottom: 24px; }
    .logo { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; color: var(--accent-gold); }
    
    .preview-box {
      width: 100%; aspect-ratio: 4/5; background: var(--input-bg);
      border: 2px dashed var(--card-border); border-radius: var(--radius);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center; margin-bottom: 12px; cursor: pointer;
    }
    .preview-box input[type="file"] {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10;
    }
    .upload-text { text-align: center; color: var(--text-muted); font-size: 13px; }
    .upload-text span { display: block; color: var(--accent-gold); font-weight: 600; font-size: 15px; }

    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; display: none; }
    #imageCanvas { z-index: 1; }
    #maskCanvas { z-index: 2; cursor: crosshair; }

    .instructions {
      font-size: 12px; color: var(--accent-gold); text-align: center;
      margin-bottom: 16px; display: none; background: rgba(212, 175, 55, 0.1);
      padding: 8px; border-radius: 8px;
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    select {
      width: 100%; background: var(--input-bg); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 12px 14px; color: var(--text-main); font-size: 14px; outline: none;
    }
    
    .btn-submit {
      width: 100%; background: var(--accent-gold); color: #000; border: none;
      border-radius: 10px; padding: 15px; font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 10px;
    }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    #clearBtn {
      background: transparent; color: var(--text-muted); border: 1px solid var(--card-border);
      padding: 6px 12px; font-size: 11px; border-radius: 6px; cursor: pointer; margin: 0 auto 16px auto; display: none;
    }

    #statusText { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 12px; display: none; }
    #resultContainer { margin-top: 20px; display: none; text-align: center; }
    #resultImg { width: 100%; border-radius: var(--radius); border: 1px solid var(--accent-gold); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">Grillz Studio</div>
    </div>

    <div class="preview-box" id="dropArea">
      <input type="file" id="imageInput" accept="image/*">
      <div class="upload-text" id="uploadPlaceholder">
        <span>Wgraj zdjęcie</span>(Twarz na wprost)
      </div>
      <canvas id="imageCanvas"></canvas>
      <canvas id="maskCanvas"></canvas>
    </div>

    <div class="instructions" id="hint">🖌️ Zamaluj palcem same zęby na zdjęciu</div>
    <button type="button" id="clearBtn">Wyczyść pędzel</button>

    <div class="form-group">
      <label>Materiał</label>
      <select id="material">
        <option value="14k shiny gold">Złoto 14K</option>
        <option value="925 sterling silver">Srebro 925</option>
      </select>
    </div>

    <div class="form-group">
      <label>Pozycja</label>
      <select id="position">
        <option value="top teeth">Góra (Górny łuk)</option>
        <option value="bottom teeth">Dół (Dolny łuk)</option>
        <option value="full set of teeth">Full (Góra i Dół)</option>
      </select>
    </div>

    <button type="button" class="btn-submit" id="generateBtn">Nałóż Grillz</button>

    <div id="statusText">Trwa precyzyjne nakładanie... (może potrwać ok. 15 sekund)</div>

    <div id="resultContainer">
      <label>Twój Wynik:</label>
      <img id="resultImg" alt="Wynik">
    </div>
  </div>

  <script>
    // =========================================================================
    // TUTAJ WKLEJ SWÓJ KLUCZ FAL (zostaw go w cudzysłowach)
    // =========================================================================
    const FAL_API_KEY = "TUTAJ_WKLEJ_SWOJ_KLUCZ_FAL";
    
    const imageInput = document.getElementById('imageInput');
    const imageCanvas = document.getElementById('imageCanvas');
    const maskCanvas = document.getElementById('maskCanvas');
    const imgCtx = imageCanvas.getContext('2d');
    const maskCtx = maskCanvas.getContext('2d');
    
    // Niewidoczny canvas do generowania idealnie czarno-białej maski dla AI
    const hiddenMaskCanvas = document.createElement('canvas');
    const hiddenMaskCtx = hiddenMaskCanvas.getContext('2d');

    let loadedImage = null;
    let isDrawing = false;

    // Ładowanie obrazu i ustawianie płótna
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImage = new Image();
        loadedImage.onload = setupCanvases;
        loadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function setupCanvases() {
      const container = document.getElementById('dropArea');
      const width = container.clientWidth;
      const height = container.clientHeight;

      imageCanvas.width = maskCanvas.width = hiddenMaskCanvas.width = width;
      imageCanvas.height = maskCanvas.height = hiddenMaskCanvas.height = height;

      // Czyszczenie i rysowanie zdjęcia (z zachowaniem proporcji)
      imgCtx.clearRect(0, 0, width, height);
      const scale = Math.min(width / loadedImage.width, height / loadedImage.height);
      const x = (width / 2) - (loadedImage.width / 2) * scale;
      const y = (height / 2) - (loadedImage.height / 2) * scale;
      imgCtx.drawImage(loadedImage, x, y, loadedImage.width * scale, loadedImage.height * scale);

      clearMasks();

      // UI
      document.getElementById('uploadPlaceholder').style.display = 'none';
      imageInput.style.display = 'none';
      imageCanvas.style.display = 'block';
      maskCanvas.style.display = 'block';
      document.getElementById('hint').style.display = 'block';
      document.getElementById('clearBtn').style.display = 'block';
    }

    function clearMasks() {
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      // Ukryta maska musi mieć czarne tło dla AI
      hiddenMaskCtx.fillStyle = '#000000';
      hiddenMaskCtx.fillRect(0, 0, hiddenMaskCanvas.width, hiddenMaskCanvas.height);
    }
    document.getElementById('clearBtn').addEventListener('click', clearMasks);

    // Rysowanie pędzlem
    function getPos(e) {
      const rect = maskCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) { e.preventDefault(); if(loadedImage) { isDrawing = true; draw(e); } }
    function stopDraw() { isDrawing = false; maskCtx.beginPath(); hiddenMaskCtx.beginPath(); }
    
    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);

      // Widoczny pędzel dla użytkownika (złoty, półprzezroczysty)
      maskCtx.lineWidth = 20;
      maskCtx.lineCap = 'round';
      maskCtx.strokeStyle = 'rgba(212, 175, 55, 0.6)';
      maskCtx.lineTo(pos.x, pos.y);
      maskCtx.stroke();
      maskCtx.beginPath();
      maskCtx.moveTo(pos.x, pos.y);

      // Niewidoczny pędzel dla AI (czysto biały)
      hiddenMaskCtx.lineWidth = 20;
      hiddenMaskCtx.lineCap = 'round';
      hiddenMaskCtx.strokeStyle = '#FFFFFF';
      hiddenMaskCtx.lineTo(pos.x, pos.y);
      hiddenMaskCtx.stroke();
      hiddenMaskCtx.beginPath();
      hiddenMaskCtx.moveTo(pos.x, pos.y);
    }

    maskCanvas.addEventListener('mousedown', startDraw);
    maskCanvas.addEventListener('mousemove', draw);
    maskCanvas.addEventListener('mouseup', stopDraw);
    maskCanvas.addEventListener('mouseleave', stopDraw);
    maskCanvas.addEventListener('touchstart', startDraw, {passive: false});
    maskCanvas.addEventListener('touchmove', draw, {passive: false});
    maskCanvas.addEventListener('touchend', stopDraw);

    // WYSYŁKA DO AI (Przeglądarka -> Fal.ai)
    document.getElementById('generateBtn').addEventListener('click', async () => {
      if (!loadedImage) { alert('Wgraj zdjęcie!'); return; }
      if (FAL_API_KEY.includes('TUTAJ_WKLEJ')) { alert('Nie wklejono klucza FAL API w kodzie!'); return; }

      const generateBtn = document.getElementById('generateBtn');
      const statusText = document.getElementById('statusText');
      const resultContainer = document.getElementById('resultContainer');
      const resultImg = document.getElementById('resultImg');

      generateBtn.disabled = true;
      statusText.style.display = 'block';
      resultContainer.style.display = 'none';

      try {
        const imageB64 = imageCanvas.toDataURL('image/jpeg', 0.9);
        const maskB64 = hiddenMaskCanvas.toDataURL('image/png');
        const material = document.getElementById('material').value;
        const position = document.getElementById('position').value;

        const prompt = `${material} grillz jewelry fitted perfectly on ${position}, macro photography, ultra realistic dental modification, shiny metal reflection`;

        // Używamy modelu Inpainting, który gwarantuje, że zmieni się tylko obszar pod maską
        const response = await fetch('https://fal.run/fal-ai/flux/dev/inpainting', {
          method: 'POST',
          headers: {
            'Authorization': `Key ${FAL_API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            image_url: imageB64,
            mask_url: maskB64,
            prompt: prompt,
            strength: 0.90,
            guidance_scale: 3.5,
            num_inference_steps: 25
          })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.detail || 'Błąd generowania obrazu');
        if (!data.images || !data.images[0]) throw new Error('AI nie zwróciło obrazu');

        resultImg.src = data.images[0].url;
        resultContainer.style.display = 'block';

      } catch (err) {
        alert('Błąd: ' + err.message);
      } finally {
        generateBtn.disabled = false;
        statusText.style.display = 'none';
      }
    });
  </script>
</body>
</html>
