<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GRILLZ STUDIO — Virtual Try-On</title>
  
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0c10">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(22, 24, 31, 0.95);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-gold: #d4af37;
      --accent-gold-hover: #f3ce5a;
      --text-main: #f0f2f5;
      --text-muted: #8a8f9e;
      --input-bg: #12141c;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color); color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      overscroll-behavior-y: contain;
    }
    .container {
      width: 100%; max-width: 440px; background: var(--card-bg);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 24px 20px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      position: relative; overflow: hidden;
    }
    
    .container::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('logo.png'); background-repeat: repeat;
      background-size: 70px; opacity: 0.035; pointer-events: none; z-index: 0;
    }
    .container > * { position: relative; z-index: 1; }

    .header { text-align: center; margin-bottom: 20px; }
    .logo { 
      font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; 
      color: var(--accent-gold); letter-spacing: 2px; text-transform: uppercase; 
    }
    
    .preview-box {
      width: 100%; height: 340px; background: var(--input-bg);
      border: 2px dashed var(--card-border); border-radius: var(--radius);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center; margin-bottom: 12px; cursor: pointer;
    }
    .preview-box input[type="file"] {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 20;
    }
    .upload-text { text-align: center; color: var(--text-muted); font-size: 14px; padding: 20px; z-index: 5; }
    .upload-text span { display: block; color: var(--accent-gold); font-weight: 600; font-size: 16px; margin-bottom: 4px; }

    .canvas-viewport {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden; display: none; z-index: 10;
    }
    .canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      transform-origin: 0 0; touch-action: none;
      display: flex; align-items: center; justify-content: center;
    }

    #previewImageElement {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain; pointer-events: none; z-index: 1;
    }

    #maskCanvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2; touch-action: none; cursor: crosshair;
    }

    .tools-bar { display: flex; gap: 8px; margin-bottom: 12px; display: none; }
    .btn-tool {
      flex: 1; background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--card-border);
      padding: 10px 4px; font-size: 11px; font-weight: 600; border-radius: 8px; cursor: pointer; text-transform: uppercase;
      transition: all 0.2s; text-align: center;
    }
    .btn-tool:hover { border-color: var(--accent-gold); color: var(--text-main); }

    .instructions {
      font-size: 11px; color: var(--accent-gold); text-align: center;
      margin-bottom: 12px; display: none; background: rgba(212, 175, 55, 0.08);
      padding: 8px; border-radius: 6px; line-height: 1.4;
    }

    .form-group { margin-bottom: 16px; }
    .label-title { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    
    .tiles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .option-tile {
      background: var(--input-bg); border: 2px solid var(--card-border);
      border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: center;
      gap: 10px; cursor: pointer; transition: all 0.2s ease; text-align: left;
    }
    .option-tile.center-text { flex-direction: column; text-align: center; gap: 4px; padding: 10px; }
    .option-tile:hover { border-color: rgba(212, 175, 55, 0.5); }
    .option-tile.active { border-color: var(--accent-gold); background: rgba(212, 175, 55, 0.08); }
    
    .tile-color { width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); flex-shrink: 0; }
    .tile-color.gold { background: linear-gradient(135deg, #f3ce5a 0%, #d4af37 50%, #aa820a 100%); }
    .tile-color.silver { background: linear-gradient(135deg, #ffffff 0%, #cfd5db 50%, #8a94a0 100%); }
    .tile-text { font-size: 13px; font-weight: 600; color: var(--text-main); }
    .tile-sub { font-size: 10px; color: var(--text-muted); display: block; }
    
    .btn-submit {
      width: 100%; background: var(--accent-gold); color: #000; border: none;
      border-radius: 10px; padding: 15px; font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 6px;
      transition: background 0.2s; text-transform: uppercase; letter-spacing: 1px;
    }
    .btn-submit:hover { background: var(--accent-gold-hover); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    #statusText { text-align: center; font-size: 12px; color: var(--accent-gold); margin-top: 12px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">Grillz Studio</div>
    </div>

    <div class="preview-box" id="dropArea">
      <input type="file" id="imageInput" accept="image/*">
      <div class="upload-text" id="uploadPlaceholder">
        <span>Wgraj zdjęcie</span>
      </div>
      
      <div class="canvas-viewport" id="canvasViewport">
        <div class="canvas-container" id="canvasContainer">
          <img id="previewImageElement" alt="Podgląd">
          <canvas id="maskCanvas"></canvas>
        </div>
      </div>
    </div>

    <div class="instructions" id="hint">
      🖐️ <b>Dwa palce</b>: powiększanie i przesuwanie<br>
      🖌️ <b>Jeden palec</b>: zaznaczenie zębów
    </div>
    
    <div class="tools-bar" id="toolsBar">
      <button type="button" class="btn-tool" id="clearBtn">↺ Wyczyść</button>
      <button type="button" class="btn-tool" id="resetBtn">📁 Zmień zdjęcie</button>
    </div>

    <div class="form-group">
      <span class="label-title">Wybierz materiał</span>
      <div class="tiles-grid">
        <div class="option-tile active material-tile" data-value="14k shiny gold">
          <div class="tile-color gold"></div>
          <div>
            <span class="tile-text">Złoto</span>
            <span class="tile-sub">14K Gold</span>
          </div>
        </div>
        <div class="option-tile material-tile" data-value="925 sterling silver">
          <div class="tile-color silver"></div>
          <div>
            <span class="tile-text">Srebro</span>
            <span class="tile-sub">925 Silver</span>
          </div>
        </div>
      </div>
    </div>

    <div class="form-group">
      <span class="label-title">Wybierz styl</span>
      <div class="tiles-grid">
        <div class="option-tile center-text active style-tile" data-value="full">
          <span class="tile-text">Pełne Zęby</span>
          <span class="tile-sub">Solid Caps</span>
        </div>
        <div class="option-tile center-text style-tile" data-value="open">
          <span class="tile-text">Ramki</span>
          <span class="tile-sub">Open Face</span>
        </div>
      </div>
    </div>

    <button type="button" class="btn-submit" id="generateBtn">Przymiarka</button>

    <div id="statusText">AI renderuje biżuterię w wysokiej rozdzielczości...</div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const dropArea = document.getElementById('dropArea');
    const canvasViewport = document.getElementById('canvasViewport');
    const canvasContainer = document.getElementById('canvasContainer');
    const previewImageElement = document.getElementById('previewImageElement');
    const maskCanvas = document.getElementById('maskCanvas');
    const maskCtx = maskCanvas.getContext('2d');
    
    const hiddenImageCanvas = document.createElement('canvas');
    const hiddenImgCtx = hiddenImageCanvas.getContext('2d');
    const hiddenMaskCanvas = document.createElement('canvas');
    const hiddenMaskCtx = hiddenMaskCanvas.getContext('2d');

    let loadedImage = null;
    let originalNaturalWidth = 0;
    let originalNaturalHeight = 0;
    
    let isDrawing = false;
    let isPanning = false;
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let initialDistance = 0;
    let initialScale = 1;
    let initialPanX = 0;
    let initialPanY = 0;
    let initialCenterX = 0;
    let initialCenterY = 0;

    let selectedMaterial = "14k shiny gold";
    let selectedStyle = "full";

    document.querySelectorAll('.material-tile').forEach(tile => {
      tile.addEventListener('click', () => {
        document.querySelectorAll('.material-tile').forEach(t => t.classList.remove('active'));
        tile.classList.add('active');
        selectedMaterial = tile.getAttribute('data-value');
      });
    });

    document.querySelectorAll('.style-tile').forEach(tile => {
      tile.addEventListener('click', () => {
        document.querySelectorAll('.style-tile').forEach(t => t.classList.remove('active'));
        tile.classList.add('active');
        selectedStyle = tile.getAttribute('data-value');
      });
    });

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          originalNaturalWidth = img.width;
          originalNaturalHeight = img.height;

          let width = img.width;
          let height = img.height;
          const maxDim = 1280;

          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          hiddenImageCanvas.width = hiddenMaskCanvas.width = width;
          hiddenImageCanvas.height = hiddenMaskCanvas.height = height;

          hiddenImgCtx.clearRect(0, 0, width, height);
          hiddenImgCtx.drawImage(img, 0, 0, width, height);
          
          loadedImage = new Image();
          loadedImage.onload = setupViewer;
          loadedImage.src = hiddenImageCanvas.toDataURL('image/jpeg', 0.95);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function setupViewer() {
      const width = hiddenImageCanvas.width;
      const height = hiddenImageCanvas.height;

      const containerWidth = dropArea.clientWidth;
      const calculatedHeight = containerWidth * (height / width);
      dropArea.style.height = Math.min(Math.max(calculatedHeight, 280), 420) + 'px';

      hiddenMaskCtx.fillStyle = '#000000';
      hiddenMaskCtx.fillRect(0, 0, width, height);
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);

      previewImageElement.src = loadedImage.src;
      
      setTimeout(() => {
        const rect = previewImageElement.getBoundingClientRect();
        if (rect.width > 0) {
          maskCanvas.width = rect.width;
          maskCanvas.height = rect.height;
        }
      }, 50);

      scale = 1; panX = 0; panY = 0;
      updateTransform();

      document.getElementById('uploadPlaceholder').style.display = 'none';
      imageInput.style.display = 'none';
      canvasViewport.style.display = 'block';
      document.getElementById('hint').style.display = 'block';
      document.getElementById('toolsBar').style.display = 'flex';
    }

    function clearMasks() {
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      hiddenMaskCtx.fillStyle = '#000000';
      hiddenMaskCtx.fillRect(0, 0, hiddenMaskCanvas.width, hiddenMaskCanvas.height);
    }
    
    document.getElementById('clearBtn').addEventListener('click', clearMasks);

    document.getElementById('resetBtn').addEventListener('click', () => {
      loadedImage = null;
      imageInput.value = '';
      imageInput.style.display = 'block';
      document.getElementById('uploadPlaceholder').style.display = 'block';
      canvasViewport.style.display = 'none';
      document.getElementById('hint').style.display = 'none';
      document.getElementById('toolsBar').style.display = 'none';
      dropArea.style.height = '340px';
      clearMasks();
    });

    function updateTransform() {
      canvasContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function getCanvasCoords(clientX, clientY) {
      const rect = maskCanvas.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * maskCanvas.width;
      const y = ((clientY - rect.top) / rect.height) * maskCanvas.height;
      return { x, y };
    }

    maskCanvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (!loadedImage) return;

      if (e.touches.length === 2) {
        isDrawing = false;
        isPanning = true;
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        initialDistance = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        initialScale = scale;
        initialCenterX = (t1.clientX + t2.clientX) / 2;
        initialCenterY = (t1.clientY + t2.clientY) / 2;
        initialPanX = panX;
        initialPanY = panY;
      } else if (e.touches.length === 1) {
        isDrawing = true;
        isPanning = false;
        draw(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, {passive: false});

    maskCanvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!loadedImage) return;

      if (e.touches.length === 2 && isPanning) {
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const currentDistance = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
        const currentCenterX = (t1.clientX + t2.clientX) / 2;
        const currentCenterY = (t1.clientY + t2.clientY) / 2;

        const scaleRatio = currentDistance / initialDistance;
        scale = Math.min(Math.max(initialScale * scaleRatio, 1.0), 6.0); 

        const ratio = scale / initialScale;
        panX = currentCenterX - (initialCenterX - initialPanX) * ratio;
        panY = currentCenterY - (initialCenterY - initialPanY) * ratio;

        if (scale === 1) { panX = 0; panY = 0; }
        updateTransform();

      } else if (e.touches.length === 1 && isDrawing) {
        draw(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, {passive: false});

    maskCanvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (e.touches.length < 2) isPanning = false;
      if (e.touches.length === 0 && isDrawing) {
        isDrawing = false;
        maskCtx.beginPath();
        hiddenMaskCtx.beginPath();
      }
    });

    maskCanvas.addEventListener('mousedown', (e) => {
      if (!loadedImage) return;
      isDrawing = true;
      draw(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', (e) => {
      if (isDrawing) draw(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', () => {
      if (isDrawing) {
        isDrawing = false;
        maskCtx.beginPath();
        hiddenMaskCtx.beginPath();
      }
    });

    function draw(clientX, clientY) {
      const pos = getCanvasCoords(clientX, clientY);
      const brushSize = Math.max(maskCanvas.width * 0.025, 12);

      maskCtx.lineWidth = brushSize;
      maskCtx.lineCap = 'round';
      maskCtx.strokeStyle = 'rgba(212, 175, 55, 0.75)';
      maskCtx.lineTo(pos.x, pos.y);
      maskCtx.stroke();
      maskCtx.beginPath();
      maskCtx.moveTo(pos.x, pos.y);

      const scaleX = hiddenMaskCanvas.width / maskCanvas.width;
      const scaleY = hiddenMaskCanvas.height / maskCanvas.height;
      const hiddenX = pos.x * scaleX;
      const hiddenY = pos.y * scaleY;
      const hiddenBrushSize = brushSize * scaleX;

      hiddenMaskCtx.lineWidth = hiddenBrushSize;
      hiddenMaskCtx.lineCap = 'round';
      hiddenMaskCtx.strokeStyle = '#FFFFFF';
      hiddenMaskCtx.lineTo(hiddenX, hiddenY);
      hiddenMaskCtx.stroke();
      hiddenMaskCtx.beginPath();
      hiddenMaskCtx.moveTo(hiddenX, hiddenY);
    }

    // ARCHITEKTURA CROP & SEAMLESS STITCHING (Płynne wtapianie bez kwadratów)
    document.getElementById('generateBtn').addEventListener('click', async () => {
      if (!loadedImage) { alert('Wgraj zdjęcie!'); return; }

      const generateBtn = document.getElementById('generateBtn');
      const statusText = document.getElementById('statusText');

      generateBtn.disabled = true;
      statusText.style.display = 'block';

      try {
        const maskData = hiddenMaskCtx.getImageData(0, 0, hiddenMaskCanvas.width, hiddenMaskCanvas.height).data;
        let minX = hiddenMaskCanvas.width, minY = hiddenMaskCanvas.height, maxX = 0, maxY = 0;
        let hasPixels = false;

        for (let y = 0; y < hiddenMaskCanvas.height; y++) {
          for (let x = 0; x < hiddenMaskCanvas.width; x++) {
            const idx = (y * hiddenMaskCanvas.width + x) * 4;
            if (maskData[idx] > 128) {
              hasPixels = true;
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }

        if (!hasPixels) {
          alert('Zaznacz zęby na zdjęciu przed uruchomieniem przymiarki!');
          generateBtn.disabled = false;
          statusText.style.display = 'none';
          return;
        }

        const padding = 70;
        minX = Math.max(0, minX - padding);
        minY = Math.max(0, minY - padding);
        maxX = Math.min(hiddenMaskCanvas.width, maxX + padding);
        maxY = Math.min(hiddenMaskCanvas.height, maxY + padding);

        const cropW = maxX - minX;
        const cropH = maxY - minY;

        // Upscaling 2.5x dla detali AI
        const upscaleFactor = 2.5;
        const targetW = Math.round(cropW * upscaleFactor);
        const targetH = Math.round(cropH * upscaleFactor);

        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = targetW;
        cropCanvas.height = targetH;
        cropCanvas.getContext('2d').drawImage(hiddenImageCanvas, minX, minY, cropW, cropH, 0, 0, targetW, targetH);

        const cropMaskCanvas = document.createElement('canvas');
        cropMaskCanvas.width = targetW;
        cropMaskCanvas.height = targetH;
        const cropMaskCtx = cropMaskCanvas.getContext('2d');
        cropMaskCtx.fillStyle = '#000000';
        cropMaskCtx.fillRect(0, 0, targetW, targetH);
        cropMaskCtx.drawImage(hiddenMaskCanvas, minX, minY, cropW, cropH, 0, 0, targetW, targetH);

        const imageB64 = cropCanvas.toDataURL('image/jpeg', 0.95);
        const maskB64 = cropMaskCanvas.toDataURL('image/png');

        const response = await fetch('/.netlify/functions/generate-grillz', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: imageB64,
            mask: maskB64,
            material: selectedMaterial,
            style: selectedStyle
          })
        });

        const responseText = await response.text();
        let data;
        try {
          data = JSON.parse(responseText);
        } catch (e) {
          throw new Error(`Błąd serwera: ${responseText}`);
        }

        if (!response.ok) throw new Error(data.error || 'Błąd generowania');

        // Płynne wpasowanie za pomocą szablonu maski (Destination-in) – likwiduje widoczny kwadrat!
        const resultImg = new Image();
        resultImg.crossOrigin = "anonymous";
        resultImg.onload = () => {
          const patchCanvas = document.createElement('canvas');
          patchCanvas.width = cropW;
          patchCanvas.height = cropH;
          const pCtx = patchCanvas.getContext('2d');
          
          pCtx.drawImage(resultImg, 0, 0, targetW, targetH, 0, 0, cropW, cropH);
          
          // Używamy maski pędzla jako idealnego stensila wygładzającego krawędzie
          pCtx.globalCompositeOperation = 'destination-in';
          pCtx.drawImage(hiddenMaskCanvas, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
          
          hiddenImgCtx.drawImage(patchCanvas, minX, minY);

          const finalCanvas = document.createElement('canvas');
          finalCanvas.width = originalNaturalWidth;
          finalCanvas.height = originalNaturalHeight;
          finalCanvas.getContext('2d').drawImage(hiddenImageCanvas, 0, 0, originalNaturalWidth, originalNaturalHeight);
          
          loadedImage = new Image();
          loadedImage.onload = () => { setupViewer(); clearMasks(); };
          loadedImage.src = finalCanvas.toDataURL('image/jpeg', 0.95);
        };
        resultImg.src = data.image;

      } catch (err) {
        alert('SZCZEGÓŁY BŁĘDU:\n\n' + err.message);
      } finally {
        generateBtn.disabled = false;
        statusText.style.display = 'none';
      }
    });
  </script>
</body>
</html>
