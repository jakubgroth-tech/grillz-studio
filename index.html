<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GRILLZ STUDIO — LIVE AR</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- MediaPipe AI -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <!-- Three.js & Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0b0c10; overflow: hidden; font-family: 'Syne', sans-serif; }
    .input_video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(-1); }
    .output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; transform: scaleX(-1); pointer-events: none; }
    .ui-layer { position: absolute; bottom: 40px; left: 0; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; }
    .logo { font-size: 24px; font-weight: 800; color: #d4af37; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 4px 12px rgba(0,0,0,0.8); margin-bottom: 8px; }
    .subtext { font-size: 11px; color: #f0f2f5; text-transform: uppercase; letter-spacing: 1px; }
    #loadingScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b0c10; z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s ease; text-align: center; padding: 20px; }
    .spinner { width: 44px; height: 44px; border: 3px solid rgba(212, 175, 55, 0.2); border-top-color: #d4af37; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #d4af37; font-size: 14px; letter-spacing: 2px; line-height: 1.5; }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">ŁADOWANIE SILNIKA AR...</div>
  </div>

  <video class="input_video" autoplay playsinline muted></video>
  <canvas class="output_canvas"></canvas>

  <div class="ui-layer">
    <div class="logo">Grillz Studio</div>
    <div class="subtext">Live AR • Master Edition</div>
  </div>

  <script>
    // ==========================================
    // 1. LINKI GITHUB (RAW)
    // ==========================================
    const URL_TOP = "https://raw.githubusercontent.com/jakubgroth-tech/grillz-studio/main/grillz-top.glb";
    const URL_BOTTOM = "https://raw.githubusercontent.com/jakubgroth-tech/grillz-studio/main/grillz-bottom.glb";

    // ==========================================
    // 2. NOWY SYSTEM SKALOWANIA 
    // 1.0 oznacza, że grillz idealnie przylega od lewego do prawego kącika ust.
    // ==========================================
    const SCALE_MULTIPLIER_TOP = 1.0; 
    const SCALE_MULTIPLIER_BOTTOM = 0.95; // Dół zazwyczaj jest minimalnie węższy od góry

    // Delikatne obniżenie dołu (zwiększaj lub zmniejszaj tę wartość w pikselach)
    const MOVE_BOTTOM_DOWN = 80.0;

    // Z-Depth - Złoto fizycznie wepchnięte głęboko do tyłu (-50), za niewidzialną maskę
    const Z_DEPTH = -50; 

    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.querySelector('.output_canvas');
    const loadingScreen = document.getElementById('loadingScreen');

    const loadingManager = new THREE.LoadingManager();
    loadingManager.onLoad = () => {
      setTimeout(() => { loadingScreen.style.opacity = '0'; setTimeout(() => loadingScreen.style.display = 'none', 500); }, 800);
    };

    // ==========================================
    // 3. SILNIK I OŚWIETLENIE
    // ==========================================
    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1; 

    const scene = new THREE.Scene();

    let width = window.innerWidth;
    let height = window.innerHeight;
    const camera = new THREE.OrthographicCamera(-width/2, width/2, height/2, -height/2, 0.1, 1000);
    camera.position.z = 100;

    new THREE.RGBELoader(loadingManager).setDataType(THREE.UnsignedByteType)
      .load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/equirectangular/royal_esplanade_1k.hdr', (texture) => {
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();
        scene.environment = pmremGenerator.fromEquirectangular(texture).texture; 
        texture.dispose(); pmremGenerator.dispose();
      });

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(0, 5, 10);
    scene.add(directionalLight);

    // ==========================================
    // 4. MASKA GŁĘBI (NIEWIDZIALNA TARCZA)
    // ==========================================
    const occluderMaterial = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true });
    let occluderMesh = new THREE.Mesh(new THREE.BufferGeometry(), occluderMaterial);
    // Tarcza stoi blisko kamery, ukrywając wszystko za sobą (oprócz miejsca, gdzie wytniemy dziurę)
    occluderMesh.position.z = 0; 
    scene.add(occluderMesh);

    // ==========================================
    // 5. AUTO-NORMALIZACJA MODELI (MAGIA)
    // ==========================================
    function setupModelPro(modelScene, isTop) {
      const wrapper = new THREE.Group();
      
      const box = new THREE.Box3().setFromObject(modelScene);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      // Skaluje model do szerokości równej 1 jednostce (ułatwia to rozciąganie do kącików ust)
      const scale = 1.0 / size.x;
      modelScene.scale.set(scale, scale, scale);

      // Pivot (punkt zakotwiczenia)
      // Górne zęby kotwiczymy do GÓRNEJ krawędzi (zaczynają się pod wargą i idą w dół)
      // Dolne zęby kotwiczymy do DOLNEJ krawędzi (zaczynają się nad wargą i idą w górę)
      const pivotY = isTop ? box.max.y : box.min.y;

      modelScene.position.x = -center.x * scale;
      modelScene.position.y = -pivotY * scale;
      modelScene.position.z = -box.max.z * scale; // Przód równo z osią

      wrapper.add(modelScene);

      // Nadanie luksusowego złota
      modelScene.traverse((child) => {
        if (child.isMesh) {
          child.material.color.setHex(0xe5c573); 
          child.material.metalness = 1.0; 
          child.material.roughness = 0.12; 
          child.material.envMapIntensity = 1.6; 
        }
      });
      return wrapper;
    }

    let topWrapper = null;
    let bottomWrapper = null;

    const gltfLoader = new THREE.GLTFLoader(loadingManager);
    gltfLoader.load(URL_TOP, (gltf) => {
      topWrapper = setupModelPro(gltf.scene, true); 
      scene.add(topWrapper);
      topWrapper.visible = false; 
    });
    gltfLoader.load(URL_BOTTOM, (gltf) => {
      bottomWrapper = setupModelPro(gltf.scene, false); 
      scene.add(bottomWrapper);
      bottomWrapper.visible = false;
    });

    // ==========================================
    // 6. ANATOMICZNE ŚLEDZENIE 
    // ==========================================
    // Punkty wewnętrznej linii warg (tworzą idealny otwór w niewidzialnej tarczy)
    const MOUTH_HOLE_INDICES = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];

    function onResults(results) {
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (width !== window.innerWidth) {
        width = window.innerWidth; height = window.innerHeight;
        camera.left = -width/2; camera.right = width/2; camera.top = height/2; camera.bottom = -height/2;
        camera.updateProjectionMatrix();
      }

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && topWrapper && bottomWrapper) {
        const landmarks = results.multiFaceLandmarks[0];

        // ------------------------------------------------
        // A. AKTUALIZACJA MASKI (Wycinanie otworu na usta)
        // ------------------------------------------------
        const maskShape = new THREE.Shape();
        // Tworzymy gigantyczną tarczę przykrywającą cały ekran
        maskShape.moveTo(-width, -height);
        maskShape.lineTo(width, -height);
        maskShape.lineTo(width, height);
        maskShape.lineTo(-width, height);
        maskShape.lineTo(-width, -height);

        const mouthHole = new THREE.Path();
        const startPt = landmarks[MOUTH_HOLE_INDICES[0]];
        mouthHole.moveTo((startPt.x - 0.5) * width, -(startPt.y - 0.5) * height);
        for(let i=1; i<MOUTH_HOLE_INDICES.length; i++) {
            const pt = landmarks[MOUTH_HOLE_INDICES[i]];
            mouthHole.lineTo((pt.x - 0.5) * width, -(pt.y - 0.5) * height);
        }
        maskShape.holes.push(mouthHole); // Wycina dziurę w tarczy

        const newGeo = new THREE.ShapeGeometry(maskShape);
        if(occluderMesh.geometry) occluderMesh.geometry.dispose();
        occluderMesh.geometry = newGeo;

        // ------------------------------------------------
        // B. DOPASOWANIE ZĘBÓW (Skala, Kąt, Pozycja)
        // ------------------------------------------------
        const leftCorner = landmarks[61];
        const rightCorner = landmarks[291];
        
        // Obliczamy szerokość ust - nasze znormalizowane zęby idealnie się w to wpasują!
        const mouthWidthPixels = Math.sqrt(Math.pow((rightCorner.x - leftCorner.x) * width, 2) + Math.pow((rightCorner.y - leftCorner.y) * height, 2));

        const angleZ = Math.atan2((rightCorner.y - leftCorner.y) * height, (rightCorner.x - leftCorner.x) * width);
        const angleY = Math.asin((rightCorner.z - leftCorner.z) * 2.5);
        const topFace = landmarks[10]; const bottomFace = landmarks[152];
        const angleX = -Math.atan2((bottomFace.z - topFace.z), (bottomFace.y - topFace.y));

        // Zęby Górne (Kotwica: środek dolnej linii górnej wargi - pkt 13)
        const topLipInner = landmarks[13]; 
        topWrapper.visible = true;
        topWrapper.scale.set(mouthWidthPixels * SCALE_MULTIPLIER_TOP, mouthWidthPixels * SCALE_MULTIPLIER_TOP, mouthWidthPixels * SCALE_MULTIPLIER_TOP);
        topWrapper.rotation.set(angleX, angleY, -angleZ); 
        topWrapper.position.set((topLipInner.x - 0.5) * width, -(topLipInner.y - 0.5) * height, Z_DEPTH);

        // Zęby Dolne (Kotwica: środek górnej linii dolnej wargi - pkt 14)
        const bottomLipInner = landmarks[14];
        bottomWrapper.visible = true;
        bottomWrapper.scale.set(mouthWidthPixels * SCALE_MULTIPLIER_BOTTOM, mouthWidthPixels * SCALE_MULTIPLIER_BOTTOM, mouthWidthPixels * SCALE_MULTIPLIER_BOTTOM);
        bottomWrapper.rotation.set(angleX, angleY, -angleZ);
        bottomWrapper.position.set((bottomLipInner.x - 0.5) * width, -(bottomLipInner.y - 0.5) * height, Z_DEPTH);

      } else {
        if(topWrapper) topWrapper.visible = false;
        if(bottomWrapper) bottomWrapper.visible = false;
        if(occluderMesh.geometry) { occluderMesh.geometry.dispose(); occluderMesh.geometry = new THREE.BufferGeometry(); }
      }

      renderer.render(scene, camera);
    }

    // ==========================================
    // 7. KAMERA
    // ==========================================
    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
    faceMesh.onResults(onResults);

    const cameraHelper = new Camera(videoElement, { onFrame: async () => { await faceMesh.send({image: videoElement}); }, width: 1280, height: 720 });
    cameraHelper.start();
  </script>
</body>
</html>
