<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRILLZ STUDIO — Virtual Try-On</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0c10">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(22, 24, 31, 0.95);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-gold: #d4af37;
      --accent-gold-hover: #f3ce5a;
      --text-main: #f0f2f5;
      --text-muted: #8a8f9e;
      --input-bg: #12141c;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color); color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .container {
      width: 100%; max-width: 440px; background: var(--card-bg);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 28px 20px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      position: relative; overflow: hidden;
    }
    
    .container::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('logo.png');
      background-repeat: repeat;
      background-size: 70px;
      opacity: 0.035;
      pointer-events: none;
      z-index: 0;
    }
    .container > * { position: relative; z-index: 1; }

    .header { text-align: center; margin-bottom: 22px; }
    .logo { 
      font-family: 'Syne', sans-serif; 
      font-size: 26px; 
      font-weight: 800; 
      color: var(--accent-gold); 
      letter-spacing: 2px; 
      text-transform: uppercase; 
    }
    
    .preview-box {
      width: 100%; height: 340px; background: var(--input-bg);
      border: 2px dashed var(--card-border); border-radius: var(--radius);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center; margin-bottom: 12px; cursor: pointer;
    }
    .preview-box input[type="file"] {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 20;
    }
    .upload-text { text-align: center; color: var(--text-muted); font-size: 14px; padding: 20px; z-index: 5; }
    .upload-text span { display: block; color: var(--accent-gold); font-weight: 600; font-size: 16px; margin-bottom: 4px; }

    .canvas-viewport {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      overflow: hidden; display: none; z-index: 10;
    }
    .canvas-container {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      transform-origin: 0 0;
      touch-action: none;
    }

    #previewImageElement {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 1;
    }

    #maskCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      cursor: crosshair;
    }
    .canvas-container.pan-mode #maskCanvas { cursor: grab; }
    .canvas-container.pan-mode:active #maskCanvas { cursor: grabbing; }

    .tools-bar {
      display: flex; gap: 6px; margin-bottom: 12px; display: none;
    }
    .btn-tool {
      flex: 1; background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid var(--card-border);
      padding: 7px 4px; font-size: 11px; font-weight: 600; border-radius: 8px; cursor: pointer; text-transform: uppercase;
      transition: all 0.2s; text-align: center;
    }
    .btn-tool:hover { border-color: var(--accent-gold); color: var(--text-main); }
    .btn-tool.active-mode { background: rgba(212, 175, 55, 0.15); border-color: var(--accent-gold); color: var(--accent-gold); }

    .instructions {
      font-size: 11px; color: var(--accent-gold); text-align: center;
      margin-bottom: 12px; display: none; background: rgba(212, 175, 55, 0.08);
      padding: 6px; border-radius: 6px;
    }

    .form-group { margin-bottom: 16px; }
    .label-title { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    
    .tiles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .material-tile {
      background: var(--input-bg);
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .material-tile:hover { border-color: rgba(212, 175, 55, 0.5); }
    .material-tile.active {
      border-color: var(--accent-gold);
      background: rgba(212, 175, 55, 0.08);
    }
    .tile-color {
      width: 24px; height: 24px; border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3); flex-shrink: 0;
    }
    .tile-color.gold { background: linear-gradient(135deg, #f3ce5a 0%, #d4af37 50%, #aa820a 100%); }
    .tile-color.silver { background: linear-gradient(135deg, #ffffff 0%, #cfd5db 50%, #8a94a0 100%); }
    .tile-text { font-size: 13px; font-weight: 600; color: var(--text-main); }
    .tile-sub { font-size: 10px; color: var(--text-muted); display: block; }
    
    .btn-submit {
      width: 100%; background: var(--accent-gold); color: #000; border: none;
      border-radius: 10px; padding: 15px; font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 6px;
      transition: background 0.2s; text-transform: uppercase; letter-spacing: 1px;
    }
    .btn-submit:hover { background: var(--accent-gold-hover); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    #statusText { text-align: center; font-size: 12px; color: var(--accent-gold); margin-top: 12px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">Grillz Studio</div>
    </div>

    <div class="preview-box" id="dropArea">
      <input type="file" id="imageInput" accept="image/*">
      <div class="upload-text" id="uploadPlaceholder">
        <span>Wgraj zdjęcie</span>
      </div>
      
      <div class="canvas-viewport" id="canvasViewport">
        <div class="canvas-container" id="canvasContainer">
          <img id="previewImageElement" alt="Podgląd">
          <canvas id="maskCanvas"></canvas>
        </div>
      </div>
    </div>

    <div class="instructions" id="hint">🖌️ Przybliż lupą i zamaluj dokładnie wybrane zęby</div>
    
    <div class="tools-bar" id="toolsBar">
      <button type="button" class="btn-tool active-mode" id="modeDrawBtn">🖌️ Maluj</button>
      <button type="button" class="btn-tool" id="modePanBtn">🖐️ Przesuń</button>
      <button type="button" class="btn-tool" id="zoomInBtn">🔍➕</button>
      <button type="button" class="btn-tool" id="zoomOutBtn">🔍➖</button>
      <button type="button" class="btn-tool" id="clearBtn">↺ Czyść</button>
      <button type="button" class="btn-tool" id="resetBtn">📁 Nowe</button>
    </div>

    <div class="form-group">
      <span class="label-title">Wybierz materiał</span>
      <div class="tiles-grid">
        <div class="material-tile active" data-value="14k shiny gold" id="tileGold">
          <div class="tile-color gold"></div>
          <div>
            <span class="tile-text">Złoto</span>
            <span class="tile-sub">14K Gold</span>
          </div>
        </div>
        <div class="material-tile" data-value="925 sterling silver" id="tileSilver">
          <div class="tile-color silver"></div>
          <div>
            <span class="tile-text">Srebro</span>
            <span class="tile-sub">925 Silver</span>
          </div>
        </div>
      </div>
    </div>

    <button type="button" class="btn-submit" id="generateBtn">Przymiarka</button>

    <div id="statusText">AI generuje fotorealistyczną biżuterię...</div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const dropArea = document.getElementById('dropArea');
    const canvasViewport = document.getElementById('canvasViewport');
    const canvasContainer = document.getElementById('canvasContainer');
    const previewImageElement = document.getElementById('previewImageElement');
    const maskCanvas = document.getElementById('maskCanvas');
    const maskCtx = maskCanvas.getContext('2d');
    
    const hiddenImageCanvas = document.createElement('canvas');
    const hiddenImgCtx = hiddenImageCanvas.getContext('2d');
    const hiddenMaskCanvas = document.createElement('canvas');
    const hiddenMaskCtx = hiddenMaskCanvas.getContext('2d');

    let loadedImage = null;
    let originalNaturalWidth = 0;
    let originalNaturalHeight = 0;
    let isDrawing = false;
    let isPanning = false;
    let currentMode = 'draw';
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let startX = 0;
    let startY = 0;
    let selectedMaterial = "14k shiny gold";

    document.querySelectorAll('.material-tile').forEach(tile => {
      tile.addEventListener('click', () => {
        document.querySelectorAll('.material-tile').forEach(t => t.classList.remove('active'));
        tile.classList.add('active');
        selectedMaterial = tile.getAttribute('data-value');
      });
    });

    const modeDrawBtn = document.getElementById('modeDrawBtn');
    const modePanBtn = document.getElementById('modePanBtn');

    modeDrawBtn.addEventListener('click', () => {
      currentMode = 'draw';
      modeDrawBtn.classList.add('active-mode');
      modePanBtn.classList.remove('active-mode');
      canvasContainer.classList.remove('pan-mode');
    });

    modePanBtn.addEventListener('click', () => {
      currentMode = 'pan';
      modePanBtn.classList.add('active-mode');
      modeDrawBtn.classList.remove('active-mode');
      canvasContainer.classList.add('pan-mode');
    });

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          // Zapisujemy oryginalne wymiary wejściowe, aby zachować je bez zmian na końcu
          originalNaturalWidth = img.width;
          originalNaturalHeight = img.height;

          let width = img.width;
          let height = img.height;
          const maxDim = 1280;

          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          hiddenImageCanvas.width = hiddenMaskCanvas.width = width;
          hiddenImageCanvas.height = hiddenMaskCanvas.height = height;

          hiddenImgCtx.clearRect(0, 0, width, height);
          hiddenImgCtx.drawImage(img, 0, 0, width, height);
          
          loadedImage = new Image();
          loadedImage.onload = setupViewer;
          loadedImage.src = hiddenImageCanvas.toDataURL('image/jpeg', 0.95);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function setupViewer() {
      const width = hiddenImageCanvas.width;
      const height = hiddenImageCanvas.height;

      const containerWidth = dropArea.clientWidth;
      const calculatedHeight = containerWidth * (height / width);
      dropArea.style.height = Math.min(Math.max(calculatedHeight, 280), 420) + 'px';

      hiddenMaskCtx.fillStyle = '#000000';
      hiddenMaskCtx.fillRect(0, 0, width, height);
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);

      previewImageElement.src = loadedImage.src;
      
      setTimeout(() => {
        const rect = previewImageElement.getBoundingClientRect();
        if (rect.width > 0) {
          maskCanvas.width = rect.width;
          maskCanvas.height = rect.height;
        }
      }, 50);

      scale = 1;
      panX = 0;
      panY = 0;
      updateTransform();

      document.getElementById('uploadPlaceholder').style.display = 'none';
      imageInput.style.display = 'none';
      canvasViewport.style.display = 'block';
      document.getElementById('hint').style.display = 'block';
      document.getElementById('toolsBar').style.display = 'flex';
      
      currentMode = 'draw';
      modeDrawBtn.classList.add('active-mode');
      modePanBtn.classList.remove('active-mode');
      canvasContainer.classList.remove('pan-mode');
    }

    function clearMasks() {
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      hiddenMaskCtx.fillStyle = '#000000';
      hiddenMaskCtx.fillRect(0, 0, hiddenMaskCanvas.width, hiddenMaskCanvas.height);
    }
    
    document.getElementById('clearBtn').addEventListener('click', clearMasks);

    document.getElementById('resetBtn').addEventListener('click', () => {
      loadedImage = null;
      imageInput.value = '';
      imageInput.style.display = 'block';
      document.getElementById('uploadPlaceholder').style.display = 'block';
      canvasViewport.style.display = 'none';
      document.getElementById('hint').style.display = 'none';
      document.getElementById('toolsBar').style.display = 'none';
      dropArea.style.height = '340px';
      clearMasks();
    });

    document.getElementById('zoomInBtn').addEventListener('click', () => {
      scale = Math.min(scale + 0.5, 4.0);
      updateTransform();
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      scale = Math.max(scale - 0.5, 1.0);
      if (scale === 1) { panX = 0; panY = 0; }
      updateTransform();
    });

    function updateTransform() {
      if (scale === 1) { panX = 0; panY = 0; }
      canvasContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    window.addEventListener('resize', () => {
      if (!loadedImage) return;
      const rect = previewImageElement.getBoundingClientRect();
      if (rect.width > 0) {
        maskCanvas.width = rect.width;
        maskCanvas.height = rect.height;
      }
    });

    function getCanvasCoords(e) {
      const rect = maskCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      return { x, y };
    }

    function pointerDown(e) {
      if (!loadedImage) return;
      e.preventDefault();
      
      if (currentMode === 'pan') {
        isPanning = true;
        startX = (e.touches ? e.touches[0].clientX : e.clientX) - panX;
        startY = (e.touches ? e.touches[0].clientY : e.clientY) - panY;
      } else {
        isDrawing = true;
        draw(e);
      }
    }

    function pointerMove(e) {
      if (isPanning) {
        e.preventDefault();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        panX = clientX - startX;
        panY = clientY - startY;
        updateTransform();
      } else if (isDrawing) {
        e.preventDefault();
        draw(e);
      }
    }

    function pointerUp() {
      isDrawing = false;
      isPanning = false;
      maskCtx.beginPath();
      hiddenMaskCtx.beginPath();
    }

    function draw(e) {
      const pos = getCanvasCoords(e);
      const brushSize = Math.max(maskCanvas.width * 0.02, 10) / Math.sqrt(scale);

      maskCtx.lineWidth = brushSize;
      maskCtx.lineCap = 'round';
      maskCtx.strokeStyle = 'rgba(212, 175, 55, 0.75)';
      maskCtx.lineTo(pos.x, pos.y);
      maskCtx.stroke();
      maskCtx.beginPath();
      maskCtx.moveTo(pos.x, pos.y);

      const scaleX = hiddenMaskCanvas.width / maskCanvas.width;
      const scaleY = hiddenMaskCanvas.height / maskCanvas.height;
      const hiddenX = pos.x * scaleX;
      const hiddenY = pos.y * scaleY;
      const hiddenBrushSize = brushSize * scaleX;

      hiddenMaskCtx.lineWidth = hiddenBrushSize;
      hiddenMaskCtx.lineCap = 'round';
      hiddenMaskCtx.strokeStyle = '#FFFFFF';
      hiddenMaskCtx.lineTo(hiddenX, hiddenY);
      hiddenMaskCtx.stroke();
      hiddenMaskCtx.beginPath();
      hiddenMaskCtx.moveTo(hiddenX, hiddenY);
    }

    maskCanvas.addEventListener('mousedown', pointerDown);
    window.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);

    maskCanvas.addEventListener('touchstart', pointerDown, {passive: false});
    window.addEventListener('touchmove', pointerMove, {passive: false});
    window.addEventListener('touchend', pointerUp);

    document.getElementById('generateBtn').addEventListener('click', async () => {
      if (!loadedImage) { alert('Wgraj zdjęcie!'); return; }

      const generateBtn = document.getElementById('generateBtn');
      const statusText = document.getElementById('statusText');

      generateBtn.disabled = true;
      statusText.style.display = 'block';

      try {
        const imageB64 = hiddenImageCanvas.toDataURL('image/jpeg', 0.95);
        const maskB64 = hiddenMaskCanvas.toDataURL('image/png');

        const response = await fetch('/.netlify/functions/generate-grillz', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: imageB64,
            mask: maskB64,
            material: selectedMaterial
          })
        });

        const responseText = await response.text();
        let data;
        try {
          data = JSON.parse(responseText);
        } catch (e) {
          throw new Error(`Błąd serwera: ${responseText}`);
        }

        if (!response.ok) throw new Error(data.error || 'Błąd generowania');

        // Wymuszenie idealnego zachowania oryginalnych wymiarów (wielkości i proporcji) wejściowych
        const resultImg = new Image();
        resultImg.crossOrigin = "anonymous";
        resultImg.onload = () => {
          const finalCanvas = document.createElement('canvas');
          finalCanvas.width = originalNaturalWidth;
          finalCanvas.height = originalNaturalHeight;
          const finalCtx = finalCanvas.getContext('2d');
          
          finalCtx.drawImage(resultImg, 0, 0, originalNaturalWidth, originalNaturalHeight);
          
          loadedImage = new Image();
          loadedImage.onload = () => {
            setupViewer();
          };
          loadedImage.src = finalCanvas.toDataURL('image/jpeg', 0.95);
        };
        resultImg.src = data.image;

      } catch (err) {
        alert('SZCZEGÓŁY BŁĘDU:\n\n' + err.message);
      } finally {
        generateBtn.disabled = false;
        statusText.style.display = 'none';
      }
    });
  </script>
</body>
</html>
