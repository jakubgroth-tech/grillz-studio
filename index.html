<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grillz Studio AI</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .card { background: #1e1e1e; max-width: 450px; margin: auto; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .upload-box { border: 2px dashed #f5c518; padding: 20px; border-radius: 12px; margin-bottom: 20px; cursor: pointer; }
        img { max-width: 100%; border-radius: 8px; margin-top: 15px; display: none; }
        select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px; }
        select { background: #333; color: #fff; }
        button { background: #f5c518; color: #000; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #loader { display: none; margin: 15px 0; color: #f5c518; }
    </style>
</head>
<body>

<div class="card">
    <h2>Grillz Studio AI</h2>
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <span id="uploadText">📷 Wgraj zdjęcie uśmiechu</span>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewImage(event)">
    </div>

    <img id="imagePreview" alt="Podgląd">

    <select id="material">
        <option value="14k gold">Złoto 14K</option>
        <option value="925 silver">Srebro 925</option>
        <option value="diamond baguette">Diamenty / Diamond Pave</option>
    </select>

    <select id="style">
        <option value="top teeth grillz">Górny łuk (Top)</option>
        <option value="bottom teeth grillz">Dolny łuk (Bottom)</option>
        <option value="full cap grillz">Pełny uśmiech (Full set)</option>
        <option value="canine caps">Kły (Canines)</option>
    </select>

    <button id="generateBtn" onclick="generateAI()" disabled>GENERUJ WIZUALIZACJĘ AI</button>
    <div id="loader">⏳ Generowanie biżuterii przez AI (może to zająć ~10s)...</div>

    <img id="resultImage" alt="Wynik AI">
</div>

<script>
    let base64Image = "";

    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            base64Image = e.target.result;
            const img = document.getElementById('imagePreview');
            img.src = base64Image;
            img.style.display = 'block';
            document.getElementById('uploadText').innerText = "Zmień zdjęcie";
            document.getElementById('generateBtn').disabled = false;
        };
        reader.readAsDataURL(file);
    }

    async function generateAI() {
        const btn = document.getElementById('generateBtn');
        const loader = document.getElementById('loader');
        const resultImg = document.getElementById('resultImage');
        const material = document.getElementById('material').value;
        const style = document.getElementById('style').value;

        btn.disabled = true;
        loader.style.display = 'block';
        resultImg.style.display = 'none';

        try {
            const response = await fetch('/.netlify/functions/generate-grillz', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image: base64Image,
                    prompt: `realistic high quality ${material} ${style} custom dental grillz jewelry on teeth, highly detailed, professional photography`
                })
            });

            const data = await response.json();

            if (data.image) {
                resultImg.src = data.image;
                resultImg.style.display = 'block';
            } else {
                alert('Błąd generowania: ' + (data.error || 'Nieznany błąd'));
            }
        } catch (err) {
            alert('Błąd połączenia z serwerem AI: ' + err.message);
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
