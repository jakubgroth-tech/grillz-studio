<script>
    const imageInput = document.getElementById('imageInput');
    const placeholder = document.getElementById('placeholder');
    const canvasContainer = document.getElementById('canvasContainer');
    const imageCanvas = document.getElementById('imageCanvas');
    const maskCanvas = document.getElementById('maskCanvas');
    const canvasTools = document.getElementById('canvasTools');
    const drawHint = document.getElementById('drawHint');
    const clearMaskBtn = document.getElementById('clearMaskBtn');
    const generateBtn = document.getElementById('generateBtn');
    const statusText = document.getElementById('statusText');
    const resultContainer = document.getElementById('resultContainer');
    const resultImage = document.getElementById('resultImage');

    const imgCtx = imageCanvas.getContext('2d');
    const maskCtx = maskCanvas.getContext('2d');

    let loadedImage = null;
    let isDrawing = false;

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        loadedImage = new Image();
        loadedImage.onload = () => {
          // Pokaż kontener najpierw, aby pobrać realne wymiary z DOM
          placeholder.style.display = 'none';
          canvasContainer.style.display = 'block';
          canvasTools.style.display = 'flex';
          drawHint.style.display = 'block';

          // Krótkie opóźnienie, aby przeglądarka przeliczyła CSS kontenera
          setTimeout(setupCanvases, 50);
        };
        loadedImage.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function setupCanvases() {
      const container = document.getElementById('dropArea');
      const width = container.clientWidth;
      const height = container.clientHeight;

      imageCanvas.width = width;
      imageCanvas.height = height;
      maskCanvas.width = width;
      maskCanvas.height = height;

      imgCtx.clearRect(0, 0, width, height);

      // Obliczanie proporcji, aby zdjęcie wypełniło kontener
      const scale = Math.min(width / loadedImage.width, height / loadedImage.height);
      const x = (width / 2) - (loadedImage.width / 2) * scale;
      const y = (height / 2) - (loadedImage.height / 2) * scale;

      imgCtx.drawImage(loadedImage, x, y, loadedImage.width * scale, loadedImage.height * scale);

      clearMask();
    }

    function clearMask() {
      maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
    }

    clearMaskBtn.addEventListener('click', clearMask);

    function getPos(e) {
      const rect = maskCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      if (!loadedImage) return;
      isDrawing = true;
      draw(e);
    }

    function stopDrawing() {
      isDrawing = false;
      maskCtx.beginPath();
    }

    function draw(e) {
      if (!isDrawing || !loadedImage) return;
      const pos = getPos(e);

      maskCtx.lineWidth = 20;
      maskCtx.lineCap = 'round';
      maskCtx.lineJoin = 'round';
      maskCtx.strokeStyle = 'rgba(212, 175, 55, 0.85)';

      maskCtx.lineTo(pos.x, pos.y);
      maskCtx.stroke();
      maskCtx.beginPath();
      maskCtx.moveTo(pos.x, pos.y);
    }

    maskCanvas.addEventListener('mousedown', startDrawing);
    maskCanvas.addEventListener('mousemove', draw);
    maskCanvas.addEventListener('mouseup', stopDrawing);
    maskCanvas.addEventListener('mouseleave', stopDrawing);

    maskCanvas.addEventListener('touchstart', startDrawing);
    maskCanvas.addEventListener('touchmove', draw);
    maskCanvas.addEventListener('touchend', stopDrawing);

    function generateMaskBase64() {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = imageCanvas.width;
      exportCanvas.height = imageCanvas.height;
      const expCtx = exportCanvas.getContext('2d');

      expCtx.fillStyle = '#000000';
      expCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

      expCtx.drawImage(maskCanvas, 0, 0);
      expCtx.globalCompositeOperation = 'source-in';
      expCtx.fillStyle = '#FFFFFF';
      expCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

      return exportCanvas.toDataURL('image/png');
    }

    function generateImageBase64() {
      return imageCanvas.toDataURL('image/png');
    }

    generateBtn.addEventListener('click', async () => {
      if (!loadedImage) {
        alert('Najpierw wgraj zdjęcie uśmiechu!');
        return;
      }

      const imageB64 = generateImageBase64();
      const maskB64 = generateMaskBase64();
      const material = document.getElementById('material').value;
      const position = document.getElementById('position').value;

      generateBtn.disabled = true;
      statusText.style.display = 'block';
      statusText.innerText = 'Trwa nakładanie biżuterii na zęby...';
      resultContainer.style.display = 'none';

      try {
        const response = await fetch('/.netlify/functions/generate-grillz', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: imageB64,
            mask: maskB64,
            material: material,
            position: position
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Błąd generowania');
        }

        resultImage.src = data.image;
        resultContainer.style.display = 'block';
        statusText.style.display = 'none';

      } catch (err) {
        alert('Błąd: ' + err.message);
        statusText.innerText = 'Wystąpił błąd podczas generowania.';
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
