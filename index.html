<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GRILLZ STUDIO — LIVE AR</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- MediaPipe AI -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <!-- Three.js & Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #0b0c10; overflow: hidden; font-family: 'Syne', sans-serif;
    }
    .input_video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
    }
    .output_canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2; transform: scaleX(-1); pointer-events: none;
    }
    .ui-layer {
      position: absolute; bottom: 40px; left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; z-index: 10;
    }
    .logo {
      font-size: 24px; font-weight: 800; color: #d4af37;
      text-transform: uppercase; letter-spacing: 3px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8); margin-bottom: 8px;
    }
    #loadingScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0c10; z-index: 20; display: flex; flex-direction: column;
      justify-content: center; align-items: center; transition: opacity 0.5s ease;
    }
    .spinner {
      width: 44px; height: 44px; border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #d4af37; font-size: 14px; letter-spacing: 2px; }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">ŁADOWANIE GRILLZ STUDIO...</div>
  </div>

  <video class="input_video" autoplay playsinline muted></video>
  <canvas class="output_canvas"></canvas>

  <div class="ui-layer">
    <div class="logo">Grillz Studio</div>
  </div>

  <script>
    // ==========================================
    // LINKI DO TWOICH MODELI Z GITHUBA
    // ==========================================
    const URL_TOP = "https://raw.githubusercontent.com/jakubgroth-tech/grillz-studio/refs/heads/main/grillz-top.glb";
    const URL_BOTTOM = "https://raw.githubusercontent.com/jakubgroth-tech/grillz-studio/main/grillz-bottom.glb"; 

    // Suwaki kalibracji pozycji (możesz je zmieniać w razie potrzeby)
    const SCALE_MULTIPLIER = 1.0; 
    const TOP_Y_OFFSET = 12;   // Przesunięcie górnego grilla w górę/dół względem wargi
    const BOTTOM_Y_OFFSET = -12; // Przesunięcie dolnego grilla w górę/dół
    const Z_DEPTH_OFFSET = -5;  // Głębokość (wpychamy za wargi)

    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.querySelector('.output_canvas');
    const loadingScreen = document.getElementById('loadingScreen');

    // Awaryjne zdjęcie ekranu ładowania po 3 sekundach
    const safetyTimeout = setTimeout(() => hideLoading(), 3000);
    function hideLoading() {
      if (loadingScreen.style.display !== 'none') {
        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 500);
        clearTimeout(safetyTimeout);
      }
    }

    // ==========================================
    // SILNIK 3D (THREE.JS)
    // ==========================================
    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;

    const scene = new THREE.Scene();

    let width = window.innerWidth;
    let height = window.innerHeight;
    const camera = new THREE.OrthographicCamera(-width/2, width/2, height/2, -height/2, 0.1, 1000);
    camera.position.z = 100;

    // Oświetlenie studyjne HDRI
    new THREE.RGBELoader()
      .setDataType(THREE.UnsignedByteType)
      .load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/equirectangular/royal_esplanade_1k.hdr', (texture) => {
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();
        const envMap = pmremGenerator.fromEquirectangular(texture).texture;
        scene.environment = envMap;
        texture.dispose();
        pmremGenerator.dispose();
      });

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffee, 2.0);
    dirLight.position.set(0, 15, 25);
    scene.add(dirLight);

    let topGrillzModel = null;
    let bottomGrillzModel = null;
    let loadedCount = 0;

    function checkLoaded() {
      loadedCount++;
      if (loadedCount >= 2) hideLoading();
    }

    const gltfLoader = new THREE.GLTFLoader();
    
    // Ładowanie Góry
    gltfLoader.load(URL_TOP, (gltf) => {
      topGrillzModel = gltf.scene;
      scene.add(topGrillzModel);
      topGrillzModel.visible = false;
      checkLoaded();
    }, undefined, (err) => { console.error(err); checkLoaded(); });

    // Ładowanie Dołu
    gltfLoader.load(URL_BOTTOM, (gltf) => {
      bottomGrillzModel = gltf.scene;
      scene.add(bottomGrillzModel);
      bottomGrillzModel.visible = false;
      checkLoaded();
    }, undefined, (err) => { console.error(err); checkLoaded(); });


    // ==========================================
    // MATEMATYKA MEDIAPIPE I POZYCJONONOWANIE
    // ==========================================
    function onResults(results) {
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      if (width !== window.innerWidth) {
        width = window.innerWidth; height = window.innerHeight;
        camera.left = -width/2; camera.right = width/2;
        camera.top = height/2; camera.bottom = -height/2;
        camera.updateProjectionMatrix();
      }

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        const leftCorner = landmarks[61];
        const rightCorner = landmarks[291];
        const mouthCenterTop = landmarks[13]; 
        const mouthCenterBottom = landmarks[14];

        // Skala oparta na szerokości uśmiechu
        const mouthWidthPixels = Math.sqrt(Math.pow((rightCorner.x - leftCorner.x) * width, 2) + Math.pow((rightCorner.y - leftCorner.y) * height, 2));
        const currentScale = (mouthWidthPixels / 110) * SCALE_MULTIPLIER;

        // Rotacje głowy
        const angleZ = Math.atan2((rightCorner.y - leftCorner.y) * height, (rightCorner.x - leftCorner.x) * width);
        const angleY = Math.asin((rightCorner.z - leftCorner.z) * 2);
        const topFace = landmarks[10]; const bottomFace = landmarks[152];
        const angleX = -Math.atan2((bottomFace.z - topFace.z), (bottomFace.y - topFace.y));

        // RENDER GÓRNEGO GRILLZA
        if (topGrillzModel) {
          topGrillzModel.visible = true;
          topGrillzModel.scale.set(currentScale, currentScale, currentScale);
          topGrillzModel.rotation.set(angleX, angleY, -angleZ);
          
          topGrillzModel.position.x = (mouthCenterTop.x - 0.5) * width;
          // Dodajemy korektę Y, żeby podnieść zęby na właściwą wysokość
          topGrillzModel.position.y = -(mouthCenterTop.y - 0.5) * height + TOP_Y_OFFSET;
          topGrillzModel.position.z = (mouthCenterTop.z * width) + Z_DEPTH_OFFSET;
        }

        // RENDER DOLNEGO GRILLZA
        if (bottomGrillzModel) {
          bottomGrillzModel.visible = true;
          bottomGrillzModel.scale.set(currentScale, currentScale, currentScale);
          bottomGrillzModel.rotation.set(angleX, angleY, -angleZ);
          
          bottomGrillzModel.position.x = (mouthCenterBottom.x - 0.5) * width;
          bottomGrillzModel.position.y = -(mouthCenterBottom.y - 0.5) * height + BOTTOM_Y_OFFSET;
          bottomGrillzModel.position.z = (mouthCenterBottom.z * width) + Z_DEPTH_OFFSET;
        }

      } else {
        if(topGrillzModel) topGrillzModel.visible = false;
        if(bottomGrillzModel) bottomGrillzModel.visible = false;
      }

      renderer.render(scene, camera);
    }

    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});
    
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    faceMesh.onResults(onResults);

    const cameraHelper = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 1280,
      height: 720
    });
    cameraHelper.start();
  </script>
</body>
</html>
