<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GRILLZ STUDIO — LIVE AR AR</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- MediaPipe AI -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <!-- Three.js & Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #0b0c10; overflow: hidden; font-family: 'Syne', sans-serif;
    }
    
    .input_video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
    }
    
    .output_canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2; transform: scaleX(-1);
      pointer-events: none;
    }

    .ui-layer {
      position: absolute; bottom: 40px; left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; z-index: 10;
    }
    .logo {
      font-size: 24px; font-weight: 800; color: #d4af37;
      text-transform: uppercase; letter-spacing: 3px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8); margin-bottom: 8px;
    }
    .subtext { font-size: 11px; color: #f0f2f5; text-transform: uppercase; letter-spacing: 1px; }

    #loadingScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0c10; z-index: 20; display: flex; flex-direction: column;
      justify-content: center; align-items: center; transition: opacity 0.5s ease;
    }
    .spinner {
      width: 44px; height: 44px; border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #d4af37; font-size: 14px; letter-spacing: 2px; }
  </style>
</head>
<body>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">ŁADOWANIE SILNIKA AR...</div>
  </div>

  <video class="input_video" autoplay playsinline muted></video>
  <canvas class="output_canvas"></canvas>

  <div class="ui-layer">
    <div class="logo">Grillz Studio</div>
    <div class="subtext">Live AR • Master Edition</div>
  </div>

  <script>
    // ==========================================
    // 1. LINKI I KONFIGURACJA
    // ==========================================
    const URL_TOP = "TWOJ_LINK_DO_GORNEGO_GRILLZA.glb";
    const URL_BOTTOM = "TWOJ_LINK_DO_DOLNEGO_GRILLZA.glb";

    // Zmniejszono skalę (było 1.0, jest 0.85). Jeśli nadal za duże, zmień np. na 0.75
    const SCALE_MULTIPLIER = 0.85; 
    const Z_DEPTH_OFFSET = -10; 

    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.querySelector('.output_canvas');
    const loadingScreen = document.getElementById('loadingScreen');

    // ==========================================
    // 2. SILNIK THREE.JS I REALIZM (PBR)
    // ==========================================
    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1; // Minimalnie ściemnione dla naturalności

    const scene = new THREE.Scene();

    let width = window.innerWidth;
    let height = window.innerHeight;
    const camera = new THREE.OrthographicCamera(-width/2, width/2, height/2, -height/2, 0.1, 1000);
    camera.position.z = 100;

    // Pobieranie luksusowego HDRI (Wirtualne Studio Fotograficzne)
    new THREE.RGBELoader()
      .setDataType(THREE.UnsignedByteType)
      .load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/equirectangular/royal_esplanade_1k.hdr', (texture) => {
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();
        const envMap = pmremGenerator.fromEquirectangular(texture).texture;
        scene.environment = envMap; 
        texture.dispose();
        pmremGenerator.dispose();
      });

    // Światło (zmienione z żółtawego na czysto białe, by nie podbijać żółci)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(0, 5, 10);
    scene.add(directionalLight);

    // FUNKCJA: Fizyka Prawdziwego Złota
    // Ta funkcja nadpisuje ustawienia z Meshy.ai i zmusza materiał, by wyglądał jak premium biżuteria
    function applyRealisticGold(model) {
      model.traverse((child) => {
        if (child.isMesh) {
          // Stonowany, realistyczny odcień 14-karatowego złota (mniej jaskrawy)
          child.material.color.setHex(0xe5c573); 
          
          child.material.metalness = 1.0; // 100% metal
          child.material.roughness = 0.12; // Bardzo gładkie, niemal lustrzane (jak wypolerowane)
          child.material.envMapIntensity = 1.6; // Jak mocno odbija środowisko
          
          child.material.needsUpdate = true;
        }
      });
    }

    let topGrillzModel = null;
    let bottomGrillzModel = null;

    const gltfLoader = new THREE.GLTFLoader();
    
    gltfLoader.load(URL_TOP, (gltf) => {
      topGrillzModel = gltf.scene;
      applyRealisticGold(topGrillzModel); // Aplikujemy nasze profesjonalne złoto
      scene.add(topGrillzModel);
      topGrillzModel.visible = false; 
    });

    gltfLoader.load(URL_BOTTOM, (gltf) => {
      bottomGrillzModel = gltf.scene;
      applyRealisticGold(bottomGrillzModel); // Aplikujemy nasze profesjonalne złoto
      scene.add(bottomGrillzModel);
      bottomGrillzModel.visible = false;
      
      setTimeout(() => { loadingScreen.style.opacity = '0'; setTimeout(() => loadingScreen.style.display = 'none', 500); }, 1000);
    });

    // ==========================================
    // 3. ANATOMICZNA MATEMATYKA (MEDIAPIPE)
    // ==========================================
    function onResults(results) {
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      if (width !== window.innerWidth) {
        width = window.innerWidth; height = window.innerHeight;
        camera.left = -width/2; camera.right = width/2;
        camera.top = height/2; camera.bottom = -height/2;
        camera.updateProjectionMatrix();
      }

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && topGrillzModel && bottomGrillzModel) {
        const landmarks = results.multiFaceLandmarks[0];

        const leftCorner = landmarks[61];
        const rightCorner = landmarks[291];
        const topLipInner = landmarks[13]; 
        const bottomLipInner = landmarks[14];

        // Skala 
        const mouthWidthPixels = Math.sqrt(Math.pow((rightCorner.x - leftCorner.x) * width, 2) + Math.pow((rightCorner.y - leftCorner.y) * height, 2));
        const currentScale = (mouthWidthPixels / 100) * SCALE_MULTIPLIER; 

        // Rotacja (Tilt głowy)
        const angleZ = Math.atan2((rightCorner.y - leftCorner.y) * height, (rightCorner.x - leftCorner.x) * width);
        const angleY = Math.asin((rightCorner.z - leftCorner.z) * 2.5);
        const topFace = landmarks[10]; const bottomFace = landmarks[152];
        const angleX = -Math.atan2((bottomFace.z - topFace.z), (bottomFace.y - topFace.y));

        // Pozycja Góra
        topGrillzModel.visible = true;
        topGrillzModel.scale.set(currentScale, currentScale, currentScale);
        topGrillzModel.rotation.set(angleX, angleY, -angleZ); 
        topGrillzModel.position.x = (topLipInner.x - 0.5) * width;
        topGrillzModel.position.y = -(topLipInner.y - 0.5) * height; 
        topGrillzModel.position.z = (topLipInner.z * width) + Z_DEPTH_OFFSET;

        // Pozycja Dół
        bottomGrillzModel.visible = true;
        bottomGrillzModel.scale.set(currentScale, currentScale, currentScale);
        bottomGrillzModel.rotation.set(angleX, angleY, -angleZ);
        bottomGrillzModel.position.x = (bottomLipInner.x - 0.5) * width;
        bottomGrillzModel.position.y = -(bottomLipInner.y - 0.5) * height;
        bottomGrillzModel.position.z = (bottomLipInner.z * width) + Z_DEPTH_OFFSET;

      } else {
        if(topGrillzModel) topGrillzModel.visible = false;
        if(bottomGrillzModel) bottomGrillzModel.visible = false;
      }

      renderer.render(scene, camera);
    }

    // ==========================================
    // 4. START KAMERY
    // ==========================================
    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});
    
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true, 
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    faceMesh.onResults(onResults);

    const cameraHelper = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 1280,
      height: 720
    });
    cameraHelper.start();
  </script>
</body>
</html>
