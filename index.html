<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRILLZ STUDIO — Virtual Try-On</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(22, 24, 31, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-gold: #d4af37;
      --accent-gold-hover: #f3ce5a;
      --text-main: #f0f2f5;
      --text-muted: #8a8f9e;
      --input-bg: #12141c;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .header { text-align: center; margin-bottom: 24px; }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-gold);
    }
    .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .preview-box {
      width: 100%;
      height: 320px;
      background: var(--input-bg);
      border: 2px dashed var(--card-border);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .preview-box input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; z-index: 10;
    }

    .upload-text { text-align: center; color: var(--text-muted); font-size: 13px; pointer-events: none; }
    .upload-text span { display: block; color: var(--accent-gold); font-weight: 600; font-size: 15px; margin-bottom: 4px; }

    #previewImg { width: 100%; height: 100%; object-fit: contain; display: none; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 6px; }

    select {
      width: 100%; background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px; padding: 12px 14px;
      color: var(--text-main); font-size: 14px; outline: none;
    }

    .btn-submit {
      width: 100%; background: var(--accent-gold);
      color: #000; border: none; border-radius: 10px;
      padding: 15px; font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 800; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer; margin-top: 10px;
    }

    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    #statusText { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 12px; display: none; }

    #resultContainer { margin-top: 20px; display: none; }
    #resultImg { width: 100%; border-radius: var(--radius); border: 1px solid var(--accent-gold); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">Grillz Studio</div>
      <div class="subtitle">AI Virtual Fitting Room</div>
    </div>

    <div class="preview-box">
      <input type="file" id="imageInput" accept="image/*">
      <div class="upload-text" id="uploadPlaceholder">
        <span>Kliknij, aby wgrać zdjęcie</span>
        lub przeciągnij plik tutaj
      </div>
      <img id="previewImg" alt="Podgląd zdjęcia">
    </div>

    <div class="form-group">
      <label for="material">Materiał</label>
      <select id="material">
        <option value="14k gold">Złoto 14K</option>
        <option value="925 sterling silver">Srebro 925</option>
        <option value="diamond encrusted">Diamenty</option>
      </select>
    </div>

    <div class="form-group">
      <label for="position">Pozycja</label>
      <select id="position">
        <option value="top teeth">Góra (Górny łuk)</option>
        <option value="bottom teeth">Dół (Dolny łuk)</option>
        <option value="top and bottom teeth">Full (Góra i Dół)</option>
      </select>
    </div>

    <button type="button" class="btn-submit" id="generateBtn">Generuj Wizualizację</button>

    <div id="statusText">Trwa generowanie przez FAL AI...</div>

    <div id="resultContainer">
      <label style="text-align: center; margin-bottom: 8px; display: block;">Wynik:</label>
      <img id="resultImg" alt="Wygenerowany wynik">
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const previewImg = document.getElementById('previewImg');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const generateBtn = document.getElementById('generateBtn');
    const statusText = document.getElementById('statusText');
    const resultContainer = document.getElementById('resultContainer');
    const resultImg = document.getElementById('resultImg');

    let base64Image = null;

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        base64Image = event.target.result;
        previewImg.src = base64Image;
        previewImg.style.display = 'block';
        uploadPlaceholder.style.display = 'none';
      };
      reader.readAsDataURL(file);
    });

    generateBtn.addEventListener('click', async () => {
      const material = document.getElementById('material').value;
      const position = document.getElementById('position').value;

      generateBtn.disabled = true;
      statusText.style.display = 'block';
      resultContainer.style.display = 'none';

      try {
        const response = await fetch('/.netlify/functions/generate-grillz', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            image: base64Image,
            material: material,
            position: position
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Błąd generowania');
        }

        resultImg.src = data.image;
        resultContainer.style.display = 'block';
      } catch (err) {
        alert('Błąd FAL AI:\n' + err.message);
      } finally {
        generateBtn.disabled = false;
        statusText.style.display = 'none';
      }
    });
  </script>
</body>
</html>
