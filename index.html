<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GRILLZ STUDIO — Live AR Try-On</title>
  
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0c10">

  <!-- Google MediaPipe do śledzenia twarzy w czasie rzeczywistym -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: rgba(22, 24, 31, 0.95);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-gold: #d4af37;
      --accent-gold-hover: #f3ce5a;
      --text-main: #f0f2f5;
      --text-muted: #8a8f9e;
      --input-bg: #12141c;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color); color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      overscroll-behavior-y: contain;
    }
    .container {
      width: 100%; max-width: 440px; background: var(--card-bg);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 24px 20px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      position: relative; overflow: hidden;
    }
    
    .container::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('logo.png'); background-repeat: repeat;
      background-size: 70px; opacity: 0.035; pointer-events: none; z-index: 0;
    }
    .container > * { position: relative; z-index: 1; }

    .header { text-align: center; margin-bottom: 20px; }
    .logo { 
      font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; 
      color: var(--accent-gold); letter-spacing: 2px; text-transform: uppercase; 
    }
    
    .preview-box {
      width: 100%; height: 340px; background: var(--input-bg);
      border: 2px dashed var(--card-border); border-radius: var(--radius);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center; margin-bottom: 12px;
    }

    /* Elementy wideo i płótno AR w czasie rzeczywistym */
    #webcam {
      display: none;
    }
    #arCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Efekt lustra */
    }

    .start-screen {
      text-align: center; padding: 20px; z-index: 10;
    }
    .start-screen span { display: block; color: var(--accent-gold); font-weight: 600; font-size: 16px; margin-bottom: 8px; }
    .start-screen p { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }

    .instructions {
      font-size: 11px; color: var(--accent-gold); text-align: center;
      margin-bottom: 12px; background: rgba(212, 175, 55, 0.08);
      padding: 8px; border-radius: 6px; line-height: 1.4;
    }

    .form-group { margin-bottom: 16px; }
    .label-title { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    
    .tiles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .option-tile {
      background: var(--input-bg); border: 2px solid var(--card-border);
      border-radius: 12px; padding: 12px; display: flex; align-items: center; justify-content: center;
      gap: 10px; cursor: pointer; transition: all 0.2s ease; text-align: left;
    }
    .option-tile.center-text { flex-direction: column; text-align: center; gap: 4px; padding: 10px; }
    .option-tile:hover { border-color: rgba(212, 175, 55, 0.5); }
    .option-tile.active { border-color: var(--accent-gold); background: rgba(212, 175, 55, 0.08); }
    
    .tile-color { width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.3); flex-shrink: 0; }
    .tile-color.gold { background: linear-gradient(135deg, #f3ce5a 0%, #d4af37 50%, #aa820a 100%); }
    .tile-color.silver { background: linear-gradient(135deg, #ffffff 0%, #cfd5db 50%, #8a94a0 100%); }
    .tile-text { font-size: 13px; font-weight: 600; color: var(--text-main); }
    .tile-sub { font-size: 10px; color: var(--text-muted); display: block; }
    
    .btn-submit {
      width: 100%; background: var(--accent-gold); color: #000; border: none;
      border-radius: 10px; padding: 15px; font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 6px;
      transition: background 0.2s; text-transform: uppercase; letter-spacing: 1px;
    }
    .btn-submit:hover { background: var(--accent-gold-hover); }

    #statusText { text-align: center; font-size: 12px; color: var(--accent-gold); margin-top: 12px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">Grillz Studio</div>
    </div>

    <div class="preview-box" id="dropArea">
      <video id="webcam" playsinline></video>
      <canvas id="arCanvas"></canvas>
      
      <div class="start-screen" id="startScreen">
        <span>Żywa Przymierzalnia AR</span>
        <p>Zobacz jak prezentują się grillz w czasie rzeczywistym</p>
        <button type="button" class="btn-submit" id="startCameraBtn" style="margin-top: 0; padding: 12px;">Włącz Kamerę</button>
      </div>
    </div>

    <div class="instructions" id="hint">
      ✨ Otwórz usta szeroko przed kamerą, aby aktywować biżuterię
    </div>

    <div class="form-group">
      <span class="label-title">Wybierz materiał</span>
      <div class="tiles-grid">
        <div class="option-tile active material-tile" data-value="gold">
          <div class="tile-color gold"></div>
          <div>
            <span class="tile-text">Złoto</span>
            <span class="tile-sub">14K Gold</span>
          </div>
        </div>
        <div class="option-tile material-tile" data-value="silver">
          <div class="tile-color silver"></div>
          <div>
            <span class="tile-text">Srebro</span>
            <span class="tile-sub">925 Silver</span>
          </div>
        </div>
      </div>
    </div>

    <div class="form-group">
      <span class="label-title">Wybierz styl</span>
      <div class="tiles-grid">
        <div class="option-tile center-text active style-tile" data-value="full">
          <span class="tile-text">Pełne Zęby</span>
          <span class="tile-sub">Solid Caps</span>
        </div>
        <div class="option-tile center-text style-tile" data-value="open">
          <span class="tile-text">Ramki</span>
          <span class="tile-sub">Open Face</span>
        </div>
      </div>
    </div>

    <div id="statusText">Inicjalizacja kamery...</div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('arCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const startCameraBtn = document.getElementById('startCameraBtn');
    const statusText = document.getElementById('statusText');

    let selectedMaterial = "gold";
    let selectedStyle = "full";
    let faceMesh = null;
    let camera = null;

    document.querySelectorAll('.material-tile').forEach(tile => {
      tile.addEventListener('click', () => {
        document.querySelectorAll('.material-tile').forEach(t => t.classList.remove('active'));
        tile.classList.add('active');
        selectedMaterial = tile.getAttribute('data-value');
      });
    });

    document.querySelectorAll('.style-tile').forEach(tile => {
      tile.addEventListener('click', () => {
        document.querySelectorAll('.style-tile').forEach(t => t.classList.remove('active'));
        tile.classList.add('active');
        selectedStyle = tile.getAttribute('data-value');
      });
    });

    startCameraBtn.addEventListener('click', () => {
      startScreen.style.display = 'none';
      statusText.style.display = 'block';
      statusText.textContent = "Uruchamianie skanera twarzy...";
      initAR();
    });

    function initAR() {
      faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });

      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      faceMesh.onResults(onResults);

      camera = new Camera(videoElement, {
        onFrame: async () => {
          await faceMesh.send({ image: videoElement });
        },
        width: 640,
        height: 480
      });

      camera.start()
        .then(() => {
          statusText.style.display = 'none';
        })
        .catch(err => {
          alert("Błąd dostępu do kamery: " + err.message);
          startScreen.style.display = 'block';
          statusText.style.display = 'none';
        });
    }

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 480;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      // Rysujemy obraz z kamery
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        
        // Kluczowe punkty wewnętrznych ust / zębów w MediaPipe Face Mesh
        // 13: góra wewnętrzna, 14: dół wewnętrzna, 61: lewy kącik, 291: prawy kącik
        const upperLip = landmarks[13];
        const lowerLip = landmarks[14];
        const leftCorner = landmarks[61];
        const rightCorner = landmarks[291];

        const topY = upperLip.y * canvasElement.height;
        const bottomY = lowerLip.y * canvasElement.height;
        const leftX = leftCorner.x * canvasElement.width;
        const rightX = rightCorner.x * canvasElement.width;

        const mouthHeight = bottomY - topY;
        const mouthWidth = rightX - leftX;

        // Sprawdzamy czy usta są otwarte (mouthHeight > threshold)
        if (mouthHeight > 12) {
          drawGrillz(leftX, topY, mouthWidth, mouthHeight);
        }
      }

      canvasCtx.restore();
    }

    function drawGrillz(x, y, w, h) {
      canvasCtx.save();
      
      // Wybór gradientu w zależności od materiału
      let grad;
      if (selectedMaterial === 'gold') {
        grad = canvasCtx.createLinearGradient(x, y, x + w, y + h);
        grad.addColorStop(0, '#ffe566');
        grad.addColorStop(0.5, '#d4af37');
        grad.addColorStop(1, '#99750f');
      } else {
        grad = canvasCtx.createLinearGradient(x, y, x + w, y + h);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.5, '#cfd5db');
        grad.addColorStop(1, '#7a8593');
      }

      // Pozycja nakładki na górne zęby (tuż pod górną wargą)
      const grillzX = x - w * 0.05;
      const grillzY = y - h * 0.1;
      const grillzW = w * 1.1;
      const grillzH = h * 0.55;

      canvasCtx.fillStyle = grad;
      canvasCtx.shadowColor = 'rgba(0,0,0,0.5)';
      canvasCtx.shadowBlur = 10;

      if (selectedStyle === 'full') {
        // Styl: Pełne zęby (Solid Caps) z zaokrąglonymi rogami
        canvasCtx.beginPath();
        canvasCtx.roundRect(grillzX, grillzY, grillzW, grillzH, 6);
        canvasCtx.fill();

        // Dodanie odblasku mirror-gloss w stylu jubilerskim
        canvasCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        canvasCtx.fillRect(grillzX + grillzW * 0.1, grillzY + grillzH * 0.15, grillzW * 0.8, grillzH * 0.2);
      } else {
        // Styl: Ramki (Open Face)
        canvasCtx.lineWidth = 4;
        canvasCtx.strokeStyle = grad;
        canvasCtx.beginPath();
        canvasCtx.roundRect(grillzX, grillzY, grillzW, grillzH, 6);
        canvasCtx.stroke();
      }

      canvasCtx.restore();
    }
  </script>
</body>
</html>
