<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GRILLZ STUDIO — TEST DIAGNOSTYCZNY</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- MediaPipe AI -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #0b0c10; overflow: hidden; font-family: 'Syne', sans-serif;
    }
    .input_video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1; transform: scaleX(-1);
    }
    .output_canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2; transform: scaleX(-1); pointer-events: none;
    }
    .ui-layer {
      position: absolute; bottom: 40px; left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; z-index: 10;
    }
    .logo {
      font-size: 24px; font-weight: 800; color: #d4af37;
      text-transform: uppercase; letter-spacing: 3px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.8); margin-bottom: 8px;
    }
    /* Panel diagnostyczny na ekranie */
    #debugStatus {
      position: absolute; top: 20px; left: 20px; z-index: 30;
      background: rgba(0,0,0,0.7); color: #00ffcc; padding: 10px 15px;
      border-radius: 8px; font-family: monospace; font-size: 14px;
      border: 1px solid #00ffcc;
    }
    #loadingScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0c10; z-index: 40; display: flex; flex-direction: column;
      justify-content: center; align-items: center; transition: opacity 0.5s ease;
    }
    .spinner {
      width: 44px; height: 44px; border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #d4af37; border-radius: 50%;
      animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #d4af37; font-size: 14px; letter-spacing: 2px; }
  </style>
</head>
<body>

  <!-- Ekran ładowania (schowa się od razu) -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">URUCHAMIANIE TESTU...</div>
  </div>

  <!-- Panel diagnostyczny widoczny na żywo -->
  <div id="debugStatus">Status AI: Inicjalizowanie...</div>

  <video class="input_video" autoplay playsinline muted></video>
  <canvas class="output_canvas"></canvas>

  <div class="ui-layer">
    <div class="logo">Grillz Studio</div>
  </div>

  <script>
    const videoElement = document.querySelector('.input_video');
    const canvasElement = document.querySelector('.output_canvas');
    const loadingScreen = document.getElementById('loadingScreen');
    const debugStatus = document.getElementById('debugStatus');

    // Usuwamy ekran ładowania po sekundzie, żeby od razu widzieć kamerę
    setTimeout(() => {
      loadingScreen.style.opacity = '0';
      setTimeout(() => loadingScreen.style.display = 'none', 500);
    }, 1000);

    // ==========================================
    // SILNIK 3D I ZŁOTY OBIEKT TESTOWY
    // ==========================================
    const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
    const scene = new THREE.Scene();

    let width = window.innerWidth;
    let height = window.innerHeight;
    const camera = new THREE.OrthographicCamera(-width/2, width/2, height/2, -height/2, 0.1, 1000);
    camera.position.z = 100;

    // Światła
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(0, 10, 20);
    scene.add(dirLight);

    // Tworzymy wyraźny, złoty obiekt testowy (zamiast pliku .glb, żeby na pewno się pokazał)
    const geometry = new THREE.BoxGeometry(80, 25, 20); // Kształt dopasowany do łuku zębów
    const material = new THREE.MeshStandardMaterial({ 
      color: 0xffd700, 
      metalness: 1.0, 
      roughness: 0.1 
    });
    const testGrillz = new THREE.Mesh(geometry, material);
    scene.add(testGrillz);
    testGrillz.visible = false;

    // ==========================================
    // MEDIAPIPE I ŚLEDZENIE
    // ==========================================
    function onResults(results) {
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      if (width !== window.innerWidth) {
        width = window.innerWidth; height = window.innerHeight;
        camera.left = -width/2; camera.right = width/2;
        camera.top = height/2; camera.bottom = -height/2;
        camera.updateProjectionMatrix();
      }

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        // TWARZ WYKRYTA!
        debugStatus.innerText = "Status AI: WYKRYTO TWARZ ✅";
        debugStatus.style.borderColor = "#00ffcc";
        debugStatus.style.color = "#00ffcc";

        const landmarks = results.multiFaceLandmarks[0];
        const leftCorner = landmarks[61];
        const rightCorner = landmarks[291];
        const topLipInner = landmarks[13]; 

        // Skala na podstawie szerokości ust
        const mouthWidthPixels = Math.sqrt(Math.pow((rightCorner.x - leftCorner.x) * width, 2) + Math.pow((rightCorner.y - leftCorner.y) * height, 2));
        const scaleFactor = mouthWidthPixels / 120; // Normalizacja pod rozmiar kostki

        // Rotacja
        const angleZ = Math.atan2((rightCorner.y - leftCorner.y) * height, (rightCorner.x - leftCorner.x) * width);
        const angleY = Math.asin((rightCorner.z - leftCorner.z) * 2);
        const topFace = landmarks[10]; const bottomFace = landmarks[152];
        const angleX = -Math.atan2((bottomFace.z - topFace.z), (bottomFace.y - topFace.y));

        // Pozycjonowanie testowego złota na ustach
        testGrillz.visible = true;
        testGrillz.scale.set(scaleFactor, scaleFactor, scaleFactor);
        testGrillz.rotation.set(angleX, angleY, -angleZ);
        
        testGrillz.position.x = (topLipInner.x - 0.5) * width;
        testGrillz.position.y = -(topLipInner.y - 0.5) * height;
        testGrillz.position.z = 0;

      } else {
        // BRAK TWARZY W KADRZE
        debugStatus.innerText = "Status AI: SZUKAM TWARZY... ❌";
        debugStatus.style.borderColor = "#ff3333";
        debugStatus.style.color = "#ff3333";
        testGrillz.visible = false;
      }

      renderer.render(scene, camera);
    }

    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});
    
    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    faceMesh.onResults(onResults);

    const cameraHelper = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 1280,
      height: 720
    });
    cameraHelper.start();
  </script>
</body>
</html>
